<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1C1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bang Tao">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Bangkok to Bang Tao</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Chonburi&family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --sunk:#E6ECE8; --ink:#11242A; --muted:#556A6C; --line:#D5DFDA;
  --night:#0E1C1F; --night-2:#16292D; --night-ink:#EAF2EF; --night-muted:#8FA7A6;
  --lagoon:#0B7A75; --lagoon-soft:#DAEEEB; --lagoon-glow:#2FC2B5;
  --marigold:#A96C00; --marigold-fill:#E9A21A; --marigold-soft:#FAEED3;
  --orchid:#AE2F64; --orchid-soft:#F7E3EC;
  --c-food:#C98405; --c-coffee:#7A4E2D; --c-bar:#AE2F64; --c-grocery:#3F7D3A; --c-do:#0B7A75; --c-walk:#3656A8;
  --accent:var(--marigold); --accent-fill:var(--marigold-fill); --accent-soft:var(--marigold-soft); --on-fill:#1C1404; --glow:#E9A21A;
  --shadow:0 1px 2px rgba(17,36,42,.05),0 6px 20px rgba(17,36,42,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --thai-display:"Chonburi","Sarabun",serif;
  --body:"Sarabun",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --top-h:58px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1517; --surface:#1223262; --surface:#122326; --sunk:#0E1C1F; --ink:#E4EEEB; --muted:#8EA4A3; --line:#223639;
    --night:#07100F; --night-2:#0F1F21;
    --lagoon:#4CC6BB; --lagoon-soft:#10302D;
    --marigold:#F2B441; --marigold-soft:#322711;
    --orchid:#EE80AC; --orchid-soft:#381B28;
    --c-food:#F2B441; --c-coffee:#D19A6C; --c-bar:#EE80AC; --c-grocery:#7FC377; --c-do:#4CC6BB; --c-walk:#93AAF2;
    --shadow:none;
    --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) saturate(.45) contrast(.9);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1517; --surface:#122326; --sunk:#0E1C1F; --ink:#E4EEEB; --muted:#8EA4A3; --line:#223639;
  --night:#07100F; --night-2:#0F1F21;
  --lagoon:#4CC6BB; --lagoon-soft:#10302D;
  --marigold:#F2B441; --marigold-soft:#322711;
  --orchid:#EE80AC; --orchid-soft:#381B28;
  --c-food:#F2B441; --c-coffee:#D19A6C; --c-bar:#EE80AC; --c-grocery:#7FC377; --c-do:#4CC6BB; --c-walk:#93AAF2;
  --shadow:none;
  --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) saturate(.45) contrast(.9);
}
body[data-city="hkt"]{--accent:var(--lagoon); --accent-fill:var(--lagoon); --accent-soft:var(--lagoon-soft); --on-fill:#FFFFFF; --glow:var(--lagoon-glow)}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(28px,7vw,36px);line-height:1.02;font-weight:800}
h2{font-size:22px;font-weight:700;line-height:1.1}
h3{font-size:19px;font-weight:700;line-height:1.15}
p{margin:0}
.eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- header ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:500;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:var(--top-h)}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto;min-width:0}
.brand b{font:800 19px/1 var(--display);letter-spacing:-.02em;white-space:nowrap}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.offline{display:none;color:var(--orchid);font-style:normal}
.brand .short{display:none}
@media (max-width:440px){ .brand .long{display:none} .brand .short{display:inline} .seg button{padding:6px 9px;font-size:13.5px} .top .wrap{gap:8px} }
@media (max-width:350px){ .seg .dot{display:none} } body.is-offline .offline{display:inline}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.bkk{background:var(--marigold-fill)} .dot.hkt{background:var(--lagoon)}
.home-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.home-btn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- bottom nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:600;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:4px;height:var(--nav-h)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{stroke:var(--accent);stroke-width:2.2}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent-fill)}

main{padding-block:18px 32px}
section.view{display:flex;flex-direction:column;gap:20px}
.view-head{display:flex;flex-direction:column;gap:6px}

/* ---------- hero ---------- */
.hero{background:var(--night);color:var(--night-ink);border-radius:22px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:80%;aspect-ratio:1;background:radial-gradient(closest-side,color-mix(in srgb,var(--glow) 38%,transparent),transparent);z-index:-1;filter:blur(8px)}
.hero::after{content:"";position:absolute;inset:auto auto -50% -30%;width:70%;aspect-ratio:1;background:radial-gradient(closest-side,color-mix(in srgb,var(--orchid) 18%,transparent),transparent);z-index:-1}
.hero .eyebrow{color:var(--night-muted)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.thai-name{font:400 clamp(40px,12vw,64px)/1.15 var(--thai-display);color:var(--glow);letter-spacing:0;margin-top:2px}
.en-name{font:700 15px var(--display);letter-spacing:.02em;color:var(--night-ink);opacity:.92}
.counter{text-align:right}
.counter b{display:block;font:800 clamp(34px,9vw,46px)/1 var(--display);letter-spacing:-.03em}
.counter span{font:500 11px var(--mono);color:var(--night-muted);text-transform:uppercase;letter-spacing:.08em}
.line-svg{width:100%;height:auto;display:block;overflow:visible}
.line-svg text{font:500 9px var(--mono);fill:var(--night-muted);letter-spacing:.06em}
.line-svg text.k{fill:var(--night-ink)}
.pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.hero-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--night-muted)}
.hero-meta b{color:var(--night-ink);font-weight:600}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);min-width:0}
.card .head{display:flex;gap:11px;align-items:flex-start}
.card .head .t{flex:1;min-width:0}
.glyph{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--cat) 14%,transparent);color:var(--cat)}
.glyph svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cat-label{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cat)}
.card .sub{font-size:14px;color:var(--muted)}
.price{font:500 14px var(--mono);white-space:nowrap;letter-spacing:.02em}
.price i{font-style:normal;opacity:.25}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.hot{background:var(--orchid-soft);color:var(--orchid)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2}
.order{font-size:15px}
.order ul{margin:3px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.order li::marker{color:var(--cat)}
.known{font-size:15.5px;font-weight:500;line-height:1.45}
.nearby{display:flex;flex-direction:column;gap:5px;border-top:1px dashed var(--line);padding-top:9px}
.mini{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini small{font:500 11px var(--mono);color:var(--muted)}
.lounge{display:grid;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.lounge:first-child{border-top:0}
.verdict{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);justify-self:start}
.verdict.use{background:var(--lagoon-soft);color:var(--lagoon)}
.verdict.skip{opacity:.7}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
.kv dt{font:500 10.5px/2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.insider{background:var(--orchid-soft);border-radius:11px;padding:9px 11px;font-size:14.5px}
.insider b{color:var(--orchid);font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.go{font-size:14.5px;display:flex;gap:9px;align-items:flex-start}
.go svg{flex:none;width:16px;height:16px;margin-top:3px;stroke:var(--accent);fill:none;stroke-width:2}
details.more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);list-style:none;width:max-content}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";font-family:var(--mono)}
details.more[open] summary::before{content:"– "}
details.more .kv{margin-top:8px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.fill{background:var(--accent-fill);border-color:transparent;color:var(--on-fill)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;align-items:start}

/* ---------- filters ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 2px}
.filters::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip .dot{background:var(--cat,var(--muted))}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.count{font:500 12px var(--mono);color:var(--muted)}
.sort{display:flex;gap:4px}
.sort button{border:0;background:none;font:500 12px var(--mono);color:var(--muted);padding:4px 6px;border-radius:6px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
.sort button[aria-pressed="true"]{color:var(--ink);background:var(--sunk)}

/* ---------- near list ---------- */
.near{display:flex;flex-direction:column}
.near-row{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.near-row:first-child{border-top:0}
.near-row b{display:block;font-weight:600;line-height:1.25}
.near-row small{color:var(--muted);font-size:13px}
.dist{font:500 13px var(--mono);text-align:right;white-space:nowrap}
.dist small{display:block;font-size:11px}
.arrow{display:inline-block;transition:transform .3s}

/* ---------- map ---------- */
.map-view{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + var(--top-h) + 1px);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:1;background:var(--sunk)}
#map{position:absolute;inset:0}
.map-chips{position:absolute;top:10px;left:0;right:0;z-index:450;pointer-events:none}
.map-chips .filters{pointer-events:auto;margin:0;padding:0 12px}
.map-chips .chip{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.map-fabs{position:absolute;right:12px;bottom:12px;z-index:450;display:flex;flex-direction:column;gap:8px;transition:bottom .25s}
.fab{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.16)}
.fab svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab.on svg{stroke:#2F7BF5}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:460;max-width:520px;margin-inline:auto;max-height:62%;overflow:auto;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.sheet .card{border-radius:18px}
.sheet .x{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;border:0;background:var(--sunk);cursor:pointer;font-size:16px;line-height:1;z-index:1}
.map-note{position:absolute;left:12px;bottom:12px;z-index:440;font:500 11px var(--mono);color:var(--muted);background:var(--surface);padding:5px 9px;border-radius:8px;border:1px solid var(--line);max-width:60%}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--cat);border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center}
.pin svg{transform:rotate(45deg);width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pin.saved{outline:3px solid var(--orchid);outline-offset:1px}
.pin.been{opacity:.55}
.home-pin{width:34px;height:34px;border-radius:11px;background:var(--night);border:2px solid var(--glow);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.home-pin svg{width:18px;height:18px;stroke:var(--glow);fill:none;stroke-width:2.2}
.me{width:18px;height:18px;border-radius:50%;background:#2F7BF5;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,123,245,.25)}
.leaflet-container{font-family:var(--body);background:var(--sunk)}
.leaflet-tile-pane{filter:var(--tile-filter,saturate(.55) contrast(1.02))}
.leaflet-control-attribution{font-size:10px!important}
.leaflet-div-icon{background:none;border:0}
/* sketch map (no tiles) */
.sketch{position:absolute;inset:0;width:100%;height:100%}
.sketch .ring{fill:none;stroke:var(--line);stroke-dasharray:3 5}
.sketch text{font:500 10px var(--mono);fill:var(--muted)}

/* ---------- itinerary ---------- */
.day{display:grid;grid-template-columns:52px 1fr;gap:12px}
.day .date{text-align:center;padding-top:1px}
.day .date b{display:block;font:800 26px/1 var(--display)}
.day .date span{font:500 10.5px var(--mono);text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.day .body{border-left:3px solid var(--line);padding:0 0 20px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.bkk .body{border-left-color:var(--marigold-fill)} .day.hkt .body{border-left-color:var(--lagoon)}
.day.air .body{border-left-style:dashed}
.day.today .date b{color:var(--orchid)}
.ev{font-size:15px}
.ev .tm{font:500 12.5px var(--mono);color:var(--muted);margin-right:7px}
.ev.flag{background:var(--orchid-soft);padding:8px 11px;border-radius:11px}
.ev.fest{background:var(--lagoon-soft);padding:8px 11px;border-radius:11px}
.note{width:100%;min-height:38px;border:1px dashed var(--line);background:transparent;border-radius:11px;padding:8px 11px;font:inherit;font-size:14px;color:var(--ink);resize:vertical}
.note:focus{border-style:solid;outline:none;border-color:var(--accent)}
.booking{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.booking:first-of-type{border-top:0}
.code{font:500 15px var(--mono);letter-spacing:.08em;background:var(--sunk);padding:5px 9px;border-radius:8px;cursor:pointer;border:0}
.boarding{background:var(--night);color:var(--night-ink);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.boarding .eyebrow{color:var(--night-muted)}
.flight{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px 0;border-top:1px dashed color-mix(in srgb,var(--night-muted) 40%,transparent)}
.flight:first-of-type{border-top:0}
.flight .ap{font:800 28px/1 var(--display);letter-spacing:-.02em}
.flight .r{text-align:right}
.flight small{display:block;font:500 11.5px var(--mono);color:var(--night-muted);margin-top:5px}
.flight .mid{text-align:center;font:500 11.5px var(--mono);color:var(--glow)}
.flight .mid svg{display:block;margin:3px auto 0;width:40px;height:10px;stroke:var(--night-muted);fill:none}
.lay{font:500 11.5px var(--mono);color:var(--night-muted);text-align:center;padding:0 0 4px}

/* ---------- guide ---------- */
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
details.sec summary{cursor:pointer;padding:15px 16px;font:700 17px var(--display);display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"+";font:500 18px var(--mono);color:var(--muted)}
details.sec[open] summary::after{content:"–"}
details.sec .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.item b{display:block;font-weight:600;margin-bottom:1px}
.item p{font-size:15px}
.item a{font-size:13px;color:var(--accent);font-weight:600;text-decoration:none}
.phr{display:grid;gap:1px;padding:10px 0;border-top:1px solid var(--line)}
.phr:first-child{border-top:0}
.phr .th{font-size:23px;font-weight:600}
.phr .ph{font:500 14px var(--mono);color:var(--accent)}
.card.has-photo{padding-top:0;overflow:hidden}
.photo{display:block;position:relative;margin:0 -14px 2px;aspect-ratio:16/9;background:var(--sunk);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;right:10px;bottom:10px;background:rgba(10,20,22,.72);color:#fff;font:600 12px var(--body);padding:4px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.sheet .photo{aspect-ratio:21/9}
.stats{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.rating,.cost{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.rating b,.cost b{font:800 18px/1 var(--display);letter-spacing:-.01em}
.rating .st{color:var(--marigold-fill);font-size:13px;letter-spacing:1px}
.rating small,.cost small{font:500 11.5px var(--mono);color:var(--muted)}
.says{font-size:14.5px;color:var(--ink);border-left:2px solid var(--line);padding-left:10px}
.toolbar .chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.chip.on{border-color:var(--accent);color:var(--accent)}
.chip.sm{font-size:13px;padding:5px 10px}
.sortsel{display:flex;align-items:center;gap:8px}
.sortsel select{font:600 14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 28px 6px 12px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:14px}
.fpanel > div, .fpanel > label{display:flex;flex-direction:column;gap:7px}
.fares{border-collapse:collapse;font-size:13.5px;min-width:520px}
.fares th{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.fares td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.sea{background:var(--lagoon-soft);border-radius:16px;padding:14px 16px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.alert{background:var(--orchid-soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.alert .eyebrow{color:var(--orchid)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.check{display:flex;gap:11px;align-items:flex-start;font-size:15px;cursor:pointer;padding:3px 0}
.check input{margin-top:4px;width:17px;height:17px;accent-color:var(--orchid);flex:none}
.check.done span{text-decoration:line-through;color:var(--muted)}

/* ---------- driver card overlay ---------- */
.driver{position:fixed;inset:0;z-index:900;background:var(--night);color:var(--night-ink);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.driver .eyebrow{color:var(--night-muted)}
.driver .th{font:400 clamp(30px,8.5vw,52px)/1.35 var(--thai-display);color:var(--glow)}
.driver .en{font:700 clamp(20px,5vw,28px)/1.25 var(--display)}
.driver .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;border:1px solid var(--night-muted);background:none;color:var(--night-ink);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.driver .btn{background:var(--night-2);border-color:transparent;color:var(--night-ink)}
.driver .btn.fill{background:var(--glow);color:#0B1416}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600;z-index:950;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.install{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:16px;padding:12px 14px;font-size:14.5px}
.install b{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:720px){ .today-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:start} }

"bestTime": "n/a", "duration": "Multi-day stays / day programs", "cost": "Not researched (not recommended).", "included": "n/a", "pickup": "n/a", "rating": "Mixed; ethics complaints.", "reservation": "Not recommended.", "gettingThere": "n/a", "insiderTip": "Visiting Ayutthaya's temples is great. Just skip the elephant rides there too.", "mapsQuery": "Elephantstay Ayutthaya", "source": "https://en.wikipedia.org/wiki/Elephantstay ; https://ftnnews.com/travel-news/tours/thailand-elephant-tourism-faces-scrutiny-at-ayutthaya-attraction/", "topPick": false, "id": "bkk:elephantstay-royal-elephant-kraal-ayutthaya-", "kind": "do", "cat": "do"}, {"title": "Lumphini Park at dawn: tai chi, monitor lizards and the 6pm freeze", "area": "Lumphini / Pathum Wan", "type": "outdoors", "why": "Most tourists come at midday and see a sleepy park. Locals take it over from 4:30am with tai chi groups, aerobics and runners. Around 300–400 water monitors roam the lake edges. At 8am and 6pm the national anthem plays over loudspeakers and the whole park stops and stands still.", "bestTime": "5:30–7:30am (before the heat), or a second visit shortly before 6pm to see the anthem freeze", "cost": "Free", "gettingThere": "Walk south along Witthayu Rd. The park's east side runs along Witthayu, so it's a short walk (verify the exact distance from 1049). MRT Lumphini is at the park's southeast corner.", "insiderTip": "When the anthem starts, stop walking, stand still and stay quiet for about a minute. Locals notice if you don't. Keep a few metres from the lizards and don't feed them. Open 4:30am–10pm (verify).", "mapsQuery": "Lumphini Park Bangkok", "source": "https://thairanked.com/en/blogs/stop-national-anthem-thailand-8am-6pm/ ; https://lumpinipark.com/ ; https://www.discoverwildlife.com/animal-facts/reptiles/monitor-lizards-lumphini-park-bangkok", "id": "bkk:lumphini-park-at-dawn-tai-chi-monitor-lizards-and-the-6pm-freeze", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.7306, "lng": 100.541538, "approx": false}, {"title": "Commuter canal boat on Khlong Saen Saep to the old city", "area": "Witthayu pier → Pratunam → Phan Fa Leelard", "type": "culture", "why": "A fast, splashy commuter boat that locals use, and one of Bangkok's cheapest thrill rides. It skips the traffic between the modern center and the old royal quarter. Staff raise tarps against canal spray, and you jump on and off at each pier. It's the quickest way to reach Golden Mount, Rajadamnern Stadium and the Khao San side.", "bestTime": "Mid-morning or early afternoon, outside rush hour. Service is shorter on weekends (verify hours).", "cost": "About 10–20 THB per ride, paid in cash to the on-board fare collector (sources differ, some say 13–23 THB; verify)", "gettingThere": "Walk north up Witthayu Rd to Saphan Witthayu pier, under the Witthayu bridge near the British Embassy and BTS Phloen Chit. Ride west and change at Pratunam to the Golden Mount line, which ends at Phan Fa Leelard.", "insiderTip": "Buy a ticket to your final stop at the start, even if you change boats at Pratunam. Don't sit on the canal-side edge, and step off quickly because boats barely stop. Carry small bills.", "mapsQuery": "Witthayu Pier Khlong Saen Saep", "source": "https://en.wikipedia.org/wiki/Khlong_Saen_Saep_boat_service ; https://thaiest.com/thailand/bangkok/khlong-boat", "id": "bkk:commuter-canal-boat-on-khlong-saen-saep-to-the-old-city", "city": "bkk", "kind": "do", "cat": "do"}, {"title": "Golden Mount (Wat Saket) at golden hour", "area": "Pom Prap / Old City", "type": "culture", "why": "A 344-step spiral climb to a gold chedi with a 360° view over the old city's rooftops. It costs far less than any sky bar, and there are bells and gongs to ring on the way up. It's a 2-minute walk from the canal-boat terminus, which most visitors don't realise.", "bestTime": "4:30–5:30pm golden hour. Arrive before closing (about 7pm, verify).", "cost": "100 THB for foreigners", "gettingThere": "Saen Saep canal boat to Phan Fa Leelard pier (last stop), then walk about 5 minutes.", "insiderTip": "Combine it with a walk to Rajadamnern Stadium for Muay Thai the same evening. Both are near Phan Fa pier.", "mapsQuery": "Wat Saket Golden Mount", "source": "https://www.tukme.co/blogs/tuk-me-bangkok-travel-by-tuk-tuk/wat-saket-golden-mount-bangkok-guide ; https://www.khaosanroad.com/articles/wat-saket-golden-mount-visitor-guide-from-khao-san-road", "id": "bkk:golden-mount-wat-saket-at-golden-hour", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.753856, "lng": 100.506692, "approx": false}, {"title": "Wat Pho at 8am, then a massage at the temple's own school", "area": "Rattanakosin (Old City)", "type": "wellness", "why": "Wat Pho is the home of Thai traditional medicine. You can have a massage from its school's therapists inside the temple grounds, and most visitors walk right past the pavilions. At opening the 46m Reclining Buddha hall is nearly empty, and the tour buses arrive later.", "bestTime": "Be at the gate at 8:00am opening, then have your massage before it gets crowded. Massage runs about 8am–5pm.", "cost": "Entry 300 THB. Massage 340 THB for 30 min, 520 THB for 1 hr (verify).", "gettingThere": "MRT Lumphini → Sanam Chai (Blue Line, direct, no change), then about a 10-minute walk. Or by river to Tha Tien pier.", "insiderTip": "Do Wat Pho before the Grand Palace, which opens at 8:30. Closing time is listed as 6:30pm or 7:30pm depending on the source (verify). Knees and shoulders must be covered.", "mapsQuery": "Wat Pho Thai Traditional Massage School", "source": "https://www.timetravelturtle.com/thailand/wat-pho-bangkok/ ; https://www.watpho.com/en/contact/plan", "id": "bkk:wat-pho-at-8am-then-a-massage-at-the-temple-s-own-school", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.752111, "lng": 100.496733, "approx": true}, {"title": "Wat Arun at blue hour, seen from the opposite bank", "area": "Tha Tien (facing Wat Arun)", "type": "culture", "why": "The best view of the Temple of Dawn is at sunset from across the river, not from inside it. Around 6:30pm the floodlights come on, and for about 20 minutes the amber spire sits against a deep blue sky. You can watch for free from the riverside walkway by Tha Tien pier or from the cross-river ferry deck.", "bestTime": "Sunset through about 6:50pm. Visit inside Wat Arun in the morning (open 8am–6pm).", "cost": "Free from the bank or ferry. Entry to Wat Arun itself is 200 THB.", "gettingThere": "MRT Lumphini → Sanam Chai, then walk to Tha Tien pier.", "insiderTip": "For a drink with the view, go to one of the Tha Tien terraces (Eagle Nest, Supanniga Eating Room, Eat Sight Story) and book a front table for sunset. The cross-river ferry costs only a few baht.", "mapsQuery": "Tha Tien Pier Bangkok", "source": "https://watarun.com/attractions/sunset-viewpoints/ ; https://traveltriangle.com/thailand-tourism/bangkok/places-to-visit/wat-arun/entry-fees", "id": "bkk:wat-arun-at-blue-hour-seen-from-the-opposite-bank", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.74579, "lng": 100.490399, "approx": false}, {"title": "River by orange-flag express boat, not the tourist boat", "area": "Chao Phraya River (Sathorn pier to Tha Chang/Tha Tien)", "type": "culture", "why": "The blue-flag tourist boat costs 40 THB per trip or 150 THB for a day pass. The orange-flag commuter boat covers the same central piers (Tha Chang for the Grand Palace, Tha Tien for Wat Pho, Si Phraya/Marine Dept for Talat Noi) for a flat fare. At Sathorn pier, touts steer foreigners to the blue-flag or private longtail counters.", "bestTime": "Weekday daytime. One 2026 source says the flag lines run Monday–Friday only (verify weekend service at the pier).", "cost": "About 17–18 THB flat (sources disagree after an August 2026 fare change; verify)", "gettingThere": "BTS Phloen Chit → Siam (change) → Saphan Taksin, then walk down to Sathorn (Central) pier.", "insiderTip": "Walk past the tourist ticket tables and board where the orange-flag boats stop. Pay the conductor on board. River service may change during the Royal Barge rehearsal on Oct 2 (see events).", "mapsQuery": "Sathorn Pier Chao Phraya Express", "source": "https://bangkokboattour.com/chao-phraya-express-boat/ ; https://thaiest.com/thailand/bangkok/river-boats", "id": "bkk:river-by-orange-flag-express-boat-not-the-tourist-boat", "city": "bkk", "kind": "do", "cat": "do"}, {"title": "Talat Noi: Bangkok's old riverside Chinese quarter", "area": "Talat Noi / Samphanthawong", "type": "neighborhood", "why": "Narrow lanes of old Chinese shophouses and car-parts workshops, with street art and quiet shrines. There's the 1787 Holy Rosary Church (founded by Portuguese Catholics, Masses still held in Chinese), the So Heng Tai mansion (a heritage courtyard house with a diving pool and café), and Mother Roaster, a coffee bar upstairs in a mechanic's junkyard.", "bestTime": "Late afternoon, about 3:30–6pm, when the light is good and the workshops are still working", "cost": "Free to wander. Coffee about 100–150 THB (verify).", "gettingThere": "MRT Lumphini → Hua Lamphong (4 stops), then about a 10-minute walk. Or the river boat to Si Phraya / Marine Department pier.", "insiderTip": "A self-guided loop is about 2 hours on foot. Continue on to Yaowarat (Chinatown) for street food after dark.", "mapsQuery": "Talat Noi Bangkok So Heng Tai", "source": "https://www.tagthai.com/explore/p/talat-noi-travel-guide ; https://www.phuket101.net/bangkok/talat-noi-in-bangkok/", "id": "bkk:talat-noi-bangkok-s-old-riverside-chinese-quarter", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.733628, "lng": 100.511977, "approx": false}, {"title": "Kudi Chin: the Thai-Portuguese enclave across the river", "area": "Thonburi (Kudi Chin)", "type": "neighborhood", "why": "A 250-year-old Catholic community with the Santa Cruz Church and a free museum in a wooden house (Baan Kudichin). Families here still bake khanom farang kudi chin, a Portuguese-era cake made with duck egg and topped with raisins and candied melon. It's a mix of mosque, church and temple within a few hundred metres, and few foreigners visit.", "bestTime": "Tuesday–Sunday morning. The museum is open 9:30am–6pm and closed Mondays (Oct 5 is a Monday).", "cost": "Museum free. The ferry is about 10 THB. The cakes are cheap (verify).", "gettingThere": "MRT Lumphini → Sanam Chai, walk about 5 minutes to the pier, then take the cross-river ferry to the Wat Kalayanamit / Santa Cruz side. Then about a 5–10 minute signed walk.", "insiderTip": "Buy cakes from the family bakeries in the lanes, which have been baking them for generations. Pair this with Wat Arun or Pak Khlong Talat the same day.", "mapsQuery": "Baan Kudichin Museum", "source": "https://yourthaiguide.com/baan-kudichin-museum-tourist-faq/ ; https://thailandawaits.com/kudichin-self-guided-walk/", "id": "bkk:kudi-chin-the-thai-portuguese-enclave-across-the-river", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.739412, "lng": 100.49306, "approx": false}, {"title": "Cycle Bang Krachao, the 'green lung' (weekend: Bang Nam Phueng market)", "area": "Bang Krachao, Phra Pradaeng (Samut Prakan)", "type": "outdoors", "why": "A river-bend of jungle, mangrove and raised concrete bike paths directly across from Khlong Toei port, about 15 minutes from Sukhumvit, where you'd hardly know you're in Bangkok. The weekend-only Bang Nam Phueng market is where Thai families shop, with almost no tour groups.", "bestTime": "Saturday Oct 3 or Sunday Oct 4, from about 8am, to catch the market (open about 8am–4pm on weekends) and ride before the midday heat", "cost": "Bike rental about 50–80 THB a day. Boat about 10–20 THB each way (verify).", "gettingThere": "MRT Lumphini → Khlong Toei (1 stop), then a short taxi or Grab/Bolt to Wat Khlong Toei Nok pier, and the ferry across. Bike rentals wait at the landing.", "insiderTip": "Tell the driver 'Wat Khlong Toei Nok'. The narrow raised paths have no railings, so ride slowly. Carry water and cash.", "mapsQuery": "Wat Khlong Toei Nok Pier", "source": "https://www.bucketlistly.blog/posts/bang-krachao-travel-guide-things-to-do ; https://www.migrationology.com/bang-krachao-bangkok-bike-tour/", "id": "bkk:cycle-bang-krachao-the-green-lung-weekend-bang-nam-phueng-market-", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.707203, "lng": 100.563582, "approx": false}, {"title": "Pak Khlong Talat flower market after dark", "area": "Pak Khlong Talat (by Memorial Bridge)", "type": "market", "why": "Thailand's largest wholesale flower market has run around the clock for decades. Daytime visitors see a few stalls. At night and before dawn, porters haul mountains of marigolds and roses, and vendors string temple garlands by hand under bare bulbs.", "bestTime": "About 8–11pm, or 2–6am for the peak wholesale deliveries", "cost": "Free. A garland or a bunch of orchids costs very little.", "gettingThere": "MRT Lumphini → Sanam Chai, about a 5-minute walk. Or taxi about 20–30 min.", "insiderTip": "Wear shoes you don't mind getting wet, because the floors are hosed down. Walk the Yodpiman riverside building next door for a river view. Combine with the Wat Arun blue hour and a late dinner.", "mapsQuery": "Pak Khlong Talat Flower Market", "source": "https://www.dephanakron.com/pak-khlong-talat-flower-market/ ; https://thaiatta.com/article/details/Pak-Khlong-Talat-The-flower-market-in-the-heart-of-the-city-that-never-sleeps", "id": "bkk:pak-khlong-talat-flower-market-after-dark", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.741709, "lng": 100.49633, "approx": true}, {"title": "Khlong Toei wet market at sunrise", "area": "Khlong Toei", "type": "market", "why": "Bangkok's largest fresh market, where restaurants and households shop. It has live fish, chili mountains, fruit at marked local prices, and no souvenirs. It's the opposite of a tourist market and only one MRT stop from the hotel area.", "bestTime": "6–9am. MRT service starts about 6am, so use a taxi if you want to go earlier.", "cost": "Free. Fruit is cheap (for example, mangoes about 60 THB/kg; verify).", "gettingThere": "MRT Lumphini → Queen Sirikit National Convention Centre (exit 2), walk about 300m and use the footbridge to see both sides of the market.", "insiderTip": "Wear non-slip closed shoes and watch for trolleys. Start with the fruit and vegetable halls, because the meat halls smell strong. Carry small bills.", "mapsQuery": "Khlong Toei Market", "source": "https://www.northofknown.com/bangkok-khlong-toei-market/", "id": "bkk:khlong-toei-wet-market-at-sunrise", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.706592, "lng": 100.600878, "approx": false}, {"title": "Or Tor Kor + Chatuchak on the one weekend of your stay", "area": "Chatuchak", "type": "market", "why": "Or Tor Kor is Bangkok's premium fresh market, known for top-grade fruit, curry pastes and prepared food, and it's clean and air-cooled. Most tourists see only Chatuchak across the road. Chatuchak runs on weekends only, and your one weekend is Oct 3–4.", "bestTime": "Saturday Oct 3 or Sunday Oct 4. Or Tor Kor from about 8:30am (open 6am–8pm), then Chatuchak around 9–11am before the heat and crowds.", "cost": "Free entry", "gettingThere": "MRT Lumphini → Kamphaeng Phet (Blue Line, direct), exit 3 for Or Tor Kor. Chatuchak is next door.", "insiderTip": "Eat breakfast in the Or Tor Kor food hall, then shop Chatuchak. Save a map pin at your entrance gate because it's easy to get lost.", "mapsQuery": "Or Tor Kor Market", "source": "https://thaiest.com/blog/or-tor-kor-market-food-market-in-bangkok ; https://outthailand.com/guide/chatuchak-weekend-market/", "id": "bkk:or-tor-kor-chatuchak-on-the-one-weekend-of-your-stay", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.79713, "lng": 100.547575, "approx": false}, {"title": "Jodd Fairs Ratchada night market (the current location)", "area": "Ratchadaphisek", "type": "market", "why": "Popular with young Thais for night-market food (leng saeb spicy pork-bone soup, grilled seafood) and cheap drinks. Many blogs still send people to the Rama 9 site, but it closed in early 2025 and everything moved to Ratchada.", "bestTime": "7–10pm (open about 5pm–1am daily)", "cost": "Free entry. Dishes about 60–250 THB (verify).", "gettingThere": "MRT Lumphini → Thailand Cultural Centre (Blue Line, direct), exit 3 or 4, about a 3–5 minute walk.", "insiderTip": "Go on a weeknight (Oct 5–7) to avoid the weekend crush. Share dishes so you can try more.", "mapsQuery": "Jodd Fairs Ratchada", "source": "https://www.yodpimanriverwalk.com/jodd-fairs-night-market/ ; https://thailandaddict.com/en/bangkok-night-market-food", "id": "bkk:jodd-fairs-ratchada-night-market-the-current-location-", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.768168, "lng": 100.570918, "approx": false}, {"title": "Ari: café-and-street-food neighborhood where Bangkok's creatives live", "area": "Ari (Phahon Yothin)", "type": "neighborhood", "why": "A leafy residential district with independent cafés, the Soi Ari 4 street-food lanes and good-value Thai restaurants (such as Somtum Der). Expats and Thai creatives go here to get away from Sukhumvit, and there are no tourist crowds.", "bestTime": "Late morning for cafés, or 6–9pm for street food along Phahon Yothin 7 / Soi Ari", "cost": "Meals about 50–300 THB", "gettingThere": "BTS Phloen Chit → Ari. It's the same Sukhumvit Line northbound, with no change, about 15 minutes.", "insiderTip": "Walk the lanes off Soi Ari 1 and Soi Ari 4 instead of staying on the main road.", "mapsQuery": "Soi Ari 4 Bangkok", "source": "https://www.cktravels.com/things-to-do-ari-bangkok/ ; https://www.timeout.com/bangkok/things-to-do/great-food-and-good-vibes-at-the-hi-neighborhood-of-ari", "id": "bkk:ari-caf-and-street-food-neighborhood-where-bangkok-s-creatives-live", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.781003, "lng": 100.540909, "approx": false}, {"title": "Muay Thai at Rajadamnern: pick the right night, skip the touts", "area": "Ratchadamnoen Nok, Old City", "type": "nightlife", "why": "The oldest stadium (1945) has fights every night. Each weeknight has a different promoter. Monday, Tuesday and Friday are knockout-format cards that finish by about 9pm. Wednesday, Thursday and Sunday have traditional 5-round bouts. Saturday is the Rajadamnern World Series (RWS) production night. Touts on the approach road claim shows are sold out and charge 2–3x face value.", "bestTime": "Doors 5–6pm, fights 6–7pm. Friday Oct 2 or Mon–Tue Oct 5–6 for a KO card, Saturday Oct 3 for RWS (can sell out).", "cost": "3rd class 1,000 THB, 2nd class 1,500, Club (sections 8–9) 1,800, ringside 2,500 (2026 foreigner rates; Thais pay less)", "gettingThere": "Saen Saep boat to Phan Fa Leelard, then about a 10-minute walk. Or taxi/Grab about 20–30 min.", "insiderTip": "Buy on the official site (rajadamnern.com) or at the box office, which opens 3pm, and arrive with an e-ticket screenshot. Club Class is the best-value seat. Third class opens only when other zones fill.", "mapsQuery": "Rajadamnern Stadium", "source": "https://www.tripthaitour.com/blog/muay-thai-bangkok-rajadamnern-guide ; https://muaythaistadiums.com/rajadamnern-muay-thai-stadium/ ; https://rajadamnern.com/tickets/", "id": "bkk:muay-thai-at-rajadamnern-pick-the-right-night-skip-the-touts", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.761002, "lng": 100.508756, "approx": false}, {"title": "ONE Fight Night 48 at the 'new' Lumpinee Stadium (Sat Oct 3)", "area": "Ram Inthra, Bang Khen (north Bangkok)", "type": "event", "why": "Lumpinee Boxing Stadium is not near Lumphini Park. It moved to Ram Inthra in north Bangkok in 2014, and many visitors go to the wrong place. ONE Championship holds a big Fight Night there on Oct 3, during your stay. On regular Fridays, ONE Friday Fights has cheaper seats.", "bestTime": "Saturday Oct 3 evening (check the start time on ONE's ticketing)", "cost": "ONE Friday Fights tiers: 1,000 / 2,400 / 3,400 THB. Fight Night pricing may differ (verify).", "gettingThere": "Allow 45–75 minutes by Grab/Bolt from Witthayu Rd, depending on traffic. Leave early on a Saturday.", "insiderTip": "If you prefer Rajadamnern's old-school atmosphere, choose one stadium, not both. Book only through ONE or the stadium's official channels.", "mapsQuery": "Lumpinee Boxing Stadium Ram Inthra", "source": "https://en.wikipedia.org/wiki/2026_in_ONE_Championship ; https://muaythaistadiums.com/lumpinee-boxing-stadium/", "id": "bkk:one-fight-night-48-at-the-new-lumpinee-stadium-sat-oct-3-", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.867004, "lng": 100.608727, "approx": false}, {"title": "Health Land: the locals' mid-range massage chain", "area": "Asok (also Sathorn, Ekkamai)", "type": "wellness", "why": "A clean, consistent chain with trained therapists, used by Bangkok residents. It's a step up from the random shophouse massage places and a fraction of hotel spa prices. A 2-hour traditional Thai massage is the classic order.", "bestTime": "Late afternoon after sightseeing. Book ahead for evenings and weekends.", "cost": "About 650–700 THB for 2 hours of Thai massage (older figure; verify current price list)", "gettingThere": "BTS Phloen Chit → Asok (3 stops on the Sukhumvit Line), then a short walk or taxi to Health Land Asoke.", "insiderTip": "Ask for 'nuat phaen boran' (traditional) and say 'bao bao' if you want lighter pressure. Tip the therapist about 50–100 THB in cash (common practice).", "mapsQuery": "Health Land Spa Asoke", "source": "https://www.tripadvisor.com/Attraction_Review-g293916-d2621694-Reviews-Health_Land_Spa_Massage_Asoke-Bangkok.html", "id": "bkk:health-land-the-locals-mid-range-massage-chain", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.736649, "lng": 100.561445, "approx": true}, {"title": "Morning market + cooking class (Silom Thai Cooking School)", "area": "Silom", "type": "food", "why": "A long-running, well-reviewed school. The class starts with a walk through a real neighborhood fresh market, where instructors explain galangal, kaffir lime and shrimp paste. Then you cook five dishes at your own station, including pounding your own curry paste.", "bestTime": "Morning class (market is busiest). About 3 hours.", "cost": "About 1,200 THB per person booked direct (about 1,450 on platforms)", "gettingThere": "BTS Phloen Chit → Siam → Chong Nonsi (Silom Line). Confirm the meeting point when booking.", "insiderTip": "Book direct on the school's site to save money. Ask for 'mai phet' in class if you don't want it spicy.", "mapsQuery": "Silom Thai Cooking School", "source": "https://infobangkok.com/bangkok-cooking-classes/ ; https://www.bangkok-travel-guide.com/things-to-do/cooking-class-bangkok/", "id": "bkk:morning-market-cooking-class-silom-thai-cooking-school-", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.722649, "lng": 100.524445, "approx": false}, {"title": "Benchakitti Forest Park skywalk at sunset", "area": "Khlong Toei / Asok", "type": "outdoors", "why": "A reclaimed tobacco-factory site turned wetland forest. Its elevated skywalk frames the skyline as the towers light up, for free. It gives a rooftop-style view with no dress code and no 400-baht cocktail.", "bestTime": "5:30–7pm (open about 5am–9pm)", "cost": "Free", "gettingThere": "MRT Lumphini → Queen Sirikit National Convention Centre (2 stops). A walkway also links it toward Lumphini Park (verify the route).", "insiderTip": "Walk the raised boardwalk loop clockwise to finish facing the skyline at blue hour. Bring mosquito repellent.", "mapsQuery": "Benchakitti Forest Park Skywalk", "source": "https://yourthaiguide.com/benjakitti-forest-park-tourist-faq/ ; https://en.wikipedia.org/wiki/Benjakitti_Park", "id": "bkk:benchakitti-forest-park-skywalk-at-sunset", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.718731, "lng": 100.560172, "approx": true}, {"title": "Grand Palace done right: early, via Tha Chang, official gate only", "area": "Rattanakosin", "type": "culture", "why": "It's a must-see, but people who arrive at 11am meet the crowds, the heat and the 'it's closed today' scammers outside. Going at opening, walking straight to the official ticket office and dressing correctly makes it a very different visit.", "bestTime": "Be there at 8:30am opening. Last entry is about 3:30pm. It's open daily.", "cost": "500 THB (includes Wat Phra Kaew and the Queen Sirikit Textile Museum; verify, as some older posts cite other prices)", "gettingThere": "MRT Lumphini → Sanam Chai, about a 10–15 minute walk. Or the river boat to Tha Chang pier.", "insiderTip": "Cover shoulders, knees and ankles. Bring light long pants so you don't need to rent at the gate. Ignore anyone outside who says it's closed and walk to the main gate yourself.", "mapsQuery": "Grand Palace Bangkok ticket office", "source": "https://yourthaiguide.com/the-grand-palace-and-wat-phra-keaw/ ; https://www.bangkok-spirit.com/guides/grand-palace-scam-warning/", "id": "bkk:grand-palace-done-right-early-via-tha-chang-official-gate-only", "city": "bkk", "kind": "do", "cat": "do", "lat": 13.752111, "lng": 100.496733, "approx": true}, {"title": "Royal Barge Procession rehearsal on the Chao Phraya (Fri Oct 2)", "area": "Chao Phraya, between Rama VIII / Krung Thon Bridge and Wat Arun", "type": "event", "why": "The ornate royal barges have 52 vessels and more than 2,200 oarsmen. The full procession happens only on rare royal occasions, and the one for the Nov 6, 2026 Royal Kathin at Wat Arun is being rehearsed on the river. One minor rehearsal falls on your first day, and the public can watch free from both banks.", "bestTime": "Friday Oct 2. Rehearsals start about 2:30pm (verify on the day).", "cost": "Free", "gettingThere": "MRT Lumphini → Sanam Chai for the riverbanks near Wat Arun, or taxi to Santichaiprakarn Park / Rama VIII Park (Phra Athit).", "insiderTip": "Arrive by 1:30pm for a riverbank spot. Express boat service is modified during rehearsals, so plan to walk or take a taxi.
