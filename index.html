/* ================= map ================= */
let LMAP=null, LAYER=null, ME=null, MEACC=null, WATCH=null, TILES=null;
function mapPlaces(){ return P.filter(p=>p.city===S.city&&p.lat&&(S.mapF==="all"||(S.mapF==="saved"?S.saved[p.id]:S.mapF==="food"?["street","local","midrange","splurge"].includes(p.cat):S.mapF==="see"?p.kind==="do":p.cat===S.mapF))); }
function viewMap(){
  const chips=[["all","All",""],["saved","Saved","--orchid"],["coffee","Coffee","--c-coffee"],["food","Food","--c-food"],["bar","Bars","--c-bar"],["grocery","Groceries","--c-grocery"],["see","Do & walk","--c-do"]];
  return `<div class="map-view">
    <div id="map"></div>
    <div class="map-chips"><div class="filters">${chips.map(([k,l,v])=>`<button class="chip" data-mapf="${k}" aria-pressed="${S.mapF===k}" ${v?`style="--cat:var(${v})"`:""}>${v?'<span class="dot"></span>':""}${l}</button>`).join("")}</div></div>
    <div class="map-fabs" id="fabs">
      <button class="fab" id="fab-list" data-nearlist="1" aria-label="List nearby">${G.list}</button>
      <button class="fab" data-fly="home" aria-label="Center on home">${G.home}</button>
      ${MODE==="pwa"?`<button class="fab ${S.watching?"on":""}" id="fab-me" data-locate="1" aria-label="Show my location">${G.locate}</button>`:""}
    </div>
    <div id="sheet"></div>
    ${MODE==="artifact"?`<div class="map-note">Sketch map with distances from home.${PWA_URL?" The live GPS map is in the offline app.":""}</div>`:""}
  </div>`;
}
function pinIcon(p){
  return L.divIcon({className:"",iconSize:[26,26],iconAnchor:[13,26],html:`<div class="pin ${S.saved[p.id]?"saved":""} ${S.been[p.id]?"been":""}" style="${catVar(p)}">${G[catOf(p).g]}</div>`});
}
function mountMap(){
  const el=document.getElementById("map"); if(!el) return;
  const h=homeLL(S.city);
  if(MODE==="pwa" && window.L){
    if(LMAP){ LMAP.remove(); LMAP=null; }
    LMAP=L.map(el,{zoomControl:false,attributionControl:true}).setView(h?[h.lat,h.lng]:[13.74,100.547], S.city==="bkk"?14:13);
    TILES=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(LMAP);
    LAYER=L.layerGroup().addTo(LMAP);
    drawPins();
    LMAP.on("click",()=>closeSheet());
    if(S.me) drawMe();
    if(S.sel){ const p=byId[S.sel]; if(p){ LMAP.setView([p.lat,p.lng],16); openSheet(p.id); } }
  } else {
    drawSketch();
    if(S.sel) openSheet(S.sel);
  }
}
function drawPins(){
  if(!LAYER) return; LAYER.clearLayers();
  const h=homeLL(S.city);
  if(h) L.marker([h.lat,h.lng],{icon:L.divIcon({className:"",iconSize:[34,34],iconAnchor:[17,17],html:`<div class="home-pin">${G.home}</div>`}),zIndexOffset:1000}).on("click",()=>openDriver("home")).addTo(LAYER);
  mapPlaces().forEach(p=>L.marker([p.lat,p.lng],{icon:pinIcon(p),title:p.name||p.title}).on("click",e=>{L.DomEvent.stopPropagation(e);openSheet(p.id)}).addTo(LAYER));
}
function drawSketch(){
  const el=document.getElementById("map"); if(!el) return;
  const h=homeLL(S.city); if(!h){ el.innerHTML=`<div class="empty" style="margin:80px 16px">No coordinates yet.</div>`; return; }
  const pts=mapPlaces(); const W=el.clientWidth||360, H=el.clientHeight||600;
  const radius = S._sk || (S.city==="bkk"?4:12); // km shown to edge
  const kpx = Math.min(W,H)/2/radius, cx=W/2, cy=H/2+20;
  const proj=(lat,lng)=>[cx+(lng-h.lng)*111.32*Math.cos(h.lat*Math.PI/180)*kpx, cy-(lat-h.lat)*110.57*kpx];
  const rings=(S.city==="bkk"?[1,2,5,10,20]:[2,5,10,20,40]).filter(r=>r<=radius*1.5);
  let s=rings.map(r=>`<circle class="ring" cx="${cx}" cy="${cy}" r="${r*kpx}"/><text x="${cx+r*kpx*0.707+4}" y="${cy-r*kpx*0.707}">${r} km</text>`).join("");
  s+=pts.map(p=>{const [x,y]=proj(p.lat,p.lng);return `<g data-open-sheet="${esc(p.id)}" style="cursor:pointer;${catVar(p)}"><circle cx="${x}" cy="${y}" r="${S.saved[p.id]?9:7}" fill="var(--cat)" stroke="${S.saved[p.id]?"var(--orchid)":"var(--surface)"}" stroke-width="${S.saved[p.id]?3:2}" opacity="${S.been[p.id]?.5:1}"/></g>`}).join("");
  s+=`<rect x="${cx-12}" y="${cy-12}" width="24" height="24" rx="7" fill="var(--night)" stroke="var(--glow)" stroke-width="2"/><text x="${cx}" y="${cy+30}" text-anchor="middle" style="fill:var(--ink);font-weight:600">HOME</text>`;
  el.innerHTML=`<svg class="sketch" viewBox="0 0 ${W} ${H}">${s}</svg>
    <div style="position:absolute;left:12px;top:56px;display:flex;flex-direction:column;gap:6px;z-index:450"><button class="fab" data-zoom="-1" aria-label="Zoom in" style="font-size:22px;font-weight:600">+</button><button class="fab" data-zoom="1" aria-label="Zoom out" style="font-size:22px;font-weight:600">−</button></div>`;
}
function openSheet(id){
  const p=byId[id]; if(!p) return; S.sel=id;
  const sh=document.getElementById("sheet"); if(!sh) return;
  sh.innerHTML=`<div class="sheet"><button class="x" data-closesheet="1" aria-label="Close">×</button>${card(p,{noMap:true})}</div>`;
  const f=document.getElementById("fabs"); if(f) f.style.bottom=(sh.firstElementChild.offsetHeight+22)+"px";
  if(LMAP) LMAP.panTo([p.lat,p.lng],{animate:true});
}
function openNearList(){
  const sh=document.getElementById("sheet"); if(!sh) return;
  const from = S.me || homeLL(S.city);
  const list=mapPlaces().map(p=>({p,d:km([from.lat,from.lng],[p.lat,p.lng])})).sort((a,b)=>a.d-b.d).slice(0,25);
  sh.innerHTML=`<div class="sheet"><div class="card"><button class="x" data-closesheet="1" aria-label="Close">×</button><span class="eyebrow">Nearest to ${S.me?"you":"home"}</span><div class="near">${list.map(({p,d})=>nearRow(p,d,from)).join("")}</div></div></div>`;
  const f=document.getElementById("fabs"); if(f) f.style.bottom=(sh.firstElementChild.offsetHeight+22)+"px";
}
function closeSheet(){ S.sel=null; const sh=document.getElementById("sheet"); if(sh) sh.innerHTML=""; const f=document.getElementById("fabs"); if(f) f.style.bottom=""; }
function drawMe(){
  if(!LMAP||!S.me) return;
  const ll=[S.me.lat,S.me.lng];
  if(!ME){ ME=L.marker(ll,{icon:L.divIcon({className:"",iconSize:[18,18],iconAnchor:[9,9],html:'<div class="me"></div>'}),zIndexOffset:2000}); MEACC=L.circle(ll,{radius:S.me.acc||30,color:"#2F7BF5",weight:1,fillOpacity:.08}); }
  ME.setLatLng(ll).addTo(LMAP); MEACC.setLatLng(ll).setRadius(S.me.acc||30).addTo(LMAP);
}
function locate(){
  if(!("geolocation" in navigator)){ toast("Location isn't available here"); return; }
  if(S.watching){ LMAP&&S.me&&LMAP.setView([S.me.lat,S.me.lng],16); return; }
  toast("Finding you…");
  WATCH=navigator.geolocation.watchPosition(pos=>{
    const first=!S.me;
    S.me={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy}; S.watching=true;
    document.getElementById("fab-me")?.classList.add("on");
    drawMe(); if(first&&LMAP) LMAP.setView([S.me.lat,S.me.lng],16);
  },err=>{ toast(err.code===1?"Location permission denied":"Couldn't get location"); S.watching=false; },{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}

/* ================= render & events ================= */
const main=document.getElementById("main");
function render(){
  document.body.dataset.city=S.city;
  document.querySelectorAll("header .seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.city===S.city));
  document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b.dataset.tab===S.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if(S.tab!=="map" && LMAP){ LMAP.remove(); LMAP=null; ME=null; MEACC=null; }
  main.innerHTML = ({today:viewToday,map:viewMap,eat:()=>listView("eat"),do:()=>listView("do"),trip:viewTrip})[S.tab]();
  if(S.tab==="map") requestAnimationFrame(mountMap);
  document.querySelectorAll("textarea.note").forEach(autosize);
}
function autosize(t){t.style.height="auto";t.style.height=Math.max(38,t.scrollHeight+2)+"px"}
function go(tab){ if(tab!==S.tab){ S.fx={price:[],dist:"any",tag:"",fave:false}; S.showF=false; } S.tab=tab; S.q=""; store.set("tab",tab); render(); scrollTo(0,0); }
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-city],[data-f],[data-sort],[data-save],[data-been],[data-copytext],[data-onmap],[data-open],[data-open-sheet],[data-driver],[data-closedriver],[data-closesheet],[data-mapf],[data-locate],[data-fly],[data-nearlist],[data-sub],[data-sethome],[data-zoom],[data-jump],[data-f2],[data-showf],[data-fprice],[data-fdist],[data-freset]");
  if(!t) return; const ds=t.dataset;
  if(ds.tab){ go(ds.tab); return; }
  if(ds.jump){ const p=byId[ds.jump]; if(!p) return; if(S.tab==="map"){ openSheet(p.id); if(LMAP) LMAP.setView([p.lat,p.lng],16); return; } const tab=p.kind==="eat"?"eat":"do"; S.city=p.city; S[tab==="eat"?"eatF":"doF"]="all"; S.q=""; if(S.tab!==tab){S.tab=tab;store.set("tab",tab);} render(); requestAnimationFrame(()=>{const el=document.getElementById("card-"+p.id); if(el){el.scrollIntoView({block:"start",behavior:"smooth"}); el.animate?.([{outline:"3px solid var(--orchid)"},{outline:"3px solid transparent"}],{duration:1600});}}); return; }
  if(ds.city){ S.city=ds.city; store.set("city",S.city); S.sel=null; render(); return; }
  if(ds.f){ S[ds.f]=ds.v; render(); return; }
  if(ds.f2){ S.doF=ds.f2; S.q=""; go("do"); return; }
  if(ds.showf){ S.showF=!S.showF; rerender(); return; }
  if(ds.fprice!=null){ const v=+ds.fprice, a=S.fx.price; S.fx.price=a.includes(v)?a.filter(x=>x!==v):[...a,v]; rerender(); return; }
  if(ds.fdist){ S.fx.dist=ds.fdist; rerender(); return; }
  if(ds.freset){ S.fx={price:[],dist:"any",tag:"",fave:false}; rerender(); return; }
  if(ds.sub){ tripSub=ds.sub; store.set("tripSub",tripSub); render(); return; }
  if(ds.save){ const k=ds.save; S.saved[k]?delete S.saved[k]:S.saved[k]=1; store.set("saved",S.saved); toast(S.saved[k]?"Saved":"Removed"); refreshInPlace(k); return; }
  if(ds.been){ const k=ds.been; S.been[k]?delete S.been[k]:S.been[k]=1; store.set("been",S.been); refreshInPlace(k); return; }
  if(ds.copytext){ copy(ds.copytext); return; }
  if(ds.onmap){ const p=byId[ds.onmap]; S.city=p.city; S.sel=p.id; S.mapF="all"; go("map"); return; }
  if(ds.open){ const p=byId[ds.open]; if(S.tab==="map"){ openSheet(p.id); if(LMAP) LMAP.setView([p.lat,p.lng],16); } else { S.sel=p.id; go("map"); } return; }
  if(ds.openSheet){ openSheet(ds.openSheet); return; }
  if(ds.driver){ openDriver(ds.driver); return; }
  if(ds.closedriver){ document.getElementById("overlay").innerHTML=""; return; }
  if(ds.closesheet){ closeSheet(); return; }
  if(ds.mapf){ S.mapF=ds.mapf; document.querySelectorAll("[data-mapf]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mapf===S.mapF)); LMAP?drawPins():drawSketch(); closeSheet(); return; }
  if(ds.locate){ locate(); return; }
  if(ds.fly){ const h=homeLL(S.city); if(LMAP&&h) LMAP.setView([h.lat,h.lng],15); else { S._sk=null; drawSketch(); } return; }
  if(ds.nearlist){ openNearList(); return; }
  if(ds.zoom){ S._sk=Math.max(0.5,Math.min(80,(S._sk||(S.city==="bkk"?4:12))*(ds.zoom==="1"?1.6:0.625))); drawSketch(); return; }
  if(ds.sethome){
    navigator.geolocation?.getCurrentPosition(pos=>{ store.set("home-"+S.city,{lat:pos.coords.latitude,lng:pos.coords.longitude}); toast("Home pin updated"); document.getElementById("overlay").innerHTML=""; render(); },()=>toast("Couldn't get location"),{enableHighAccuracy:true,timeout:20000});
    return;
  }
});
function refreshInPlace(id){
  if(S.tab==="map"){ if(LMAP) drawPins(); else drawSketch(); if(S.sel===id) openSheet(id); return; }
  const y=scrollY; render(); scrollTo(0,y);
}
function rerender(){ const y=scrollY; render(); scrollTo(0,y); }
document.addEventListener("change",e=>{ const t=e.target;
  if(t.dataset.sortsel){ S.sort=t.value; store.set("sort",S.sort); rerender(); return; }
  if(t.dataset.ftag){ S.fx.tag=t.value; rerender(); return; }
  if(t.dataset.ffave){ S.fx.fave=t.checked; rerender(); return; } if(t.dataset.pre){ const d=store.get("pre",{}); d[t.dataset.pre]=t.checked; store.set("pre",d); const y=scrollY; render(); scrollTo(0,y); } });
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.note){ const n=store.get("notes",{}); n[t.dataset.note]=t.value; store.set("notes",n); autosize(t); }
  if(t.id==="q-eat"||t.id==="q-do"){ S.q=t.value; const pos=t.selectionStart; render(); const n=document.getElementById(t.id); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ document.getElementById("overlay").innerHTML=""; closeSheet(); } });
function netState(){ document.body.classList.toggle("is-offline", !navigator.onLine); }
addEventListener("online",netState); addEventListener("offline",netState); netState();
addEventListener("resize",()=>{ if(S.tab==="map"&&!LMAP) drawSketch(); });
if(MODE==="pwa" && "serviceWorker" in navigator){ addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
render();
</script>
