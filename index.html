hours 11–14 and 17–24)", "Cheap lunch at the food-hall eatery"], "hours": "08:00–22:00 (Tops site; expat guide says ~09:00–21:30) — verify", "reservation": "n/a", "gettingThere": "Walk about 10–15 min to Porto de Phuket; or Grab/Bolt ~฿80–120 for heavy bags (verify).", "insiderTip": "Better value than Villa for everyday produce; has an eatery food hall for a cheap lunch.", "mapsQuery": "Tops Food Hall Porto de Phuket", "source": "https://corporate.tops.co.th/store-branch/tops-food-hall-porto-de-phuket/", "localFavorite": true, "knownFor": "A Central-group food hall supermarket balancing Thai produce and imports, with a Tops Wine Cellar and a ready-to-eat counter; better value than Villa for everyday groceries.", "vibe": "Clean, everyday, good value", "id": "hkt:tops-food-hall-porto-de-phuket", "city": "hkt", "kind": "eat", "cat": "grocery"}, {"name": "Lotus's Cherngtalay", "area": "474 Srisoonthorn Rd, Cherngtalay", "category": "grocery", "cuisine": "Hypermarket · cheap Thai staples", "price": "฿", "approxCostPerPerson": "Local prices", "rating": "Everyday local hypermarket (formerly Tesco Lotus)", "mustOrder": ["Bulk water and soft drinks at the lowest prices", "Thai fruit, rice, eggs and noodles", "Household basics — sunscreen, laundry, bug spray", "Mon/Thu night market next door for cheap street food (verify days)"], "hours": "~09:00–21:00 (verify)", "reservation": "n/a", "gettingThere": "Grab/Bolt ~฿100–150, about 7–10 min (~3 km) (verify in app). Take a Grab car, not a bike, for bulky shopping.", "insiderTip": "The Cherngtalay night market sets up alongside on Soi Bang Tao 2 on Mon & Thu from ~16:00 — cheap food and fruit.", "mapsQuery": "Lotus's Cherngtalay, Srisoonthorn Rd, Phuket", "source": "https://www.tripadvisor.com/Attraction_Review-g293920-d5486459-Reviews-Cherngtalay_Market-Phuket.html", "localFavorite": true, "thai": "โลตัส เชิงทะเล", "knownFor": "The local hypermarket (formerly Tesco Lotus) where residents buy cheap Thai staples in bulk; the Cherngtalay night market sets up beside it.", "vibe": "Cheap, local, big-box", "id": "hkt:lotus-s-cherngtalay", "city": "hkt", "kind": "eat", "cat": "grocery", "lat": 7.986564, "lng": 98.301889, "approx": true}, {"name": "Cherngtalay Fresh Market (Talad Nat Manik, Wat Manik)", "area": "Ban Manik, Srisoonthorn Rd area, Cherngtalay", "category": "grocery", "cuisine": "Local fresh market · produce, seafood, meat, cooked food", "price": "฿", "approxCostPerPerson": "Local prices", "rating": "Working local market (phuket101, updated July 2026)", "mustOrder": ["Fresh fish and prawns for the apartment kitchen", "Seasonal tropical fruit (mangosteen, rambutan, pineapple)", "Fresh curry pastes by weight", "Grilled skewers and khanom to snack on"], "hours": "Tue & Thu ~16:00–20:00", "reservation": "n/a", "gettingThere": "Grab/Bolt ~฿100–200, about 8–10 min inland (verify in app).", "insiderTip": "Where people who live and work around Bang Tao shop for dinner. Bring small notes. Your stay covers Tue Oct 13 and Thu Oct 8.", "mapsQuery": "Wat Manik Cherngtalay market", "source": "https://www.phuket101.net/phuket-fresh-markets/", "localFavorite": true, "knownFor": "The twice-weekly working market where people who live and work around Bang Tao buy dinner: whole fish, prawns, fruit, curry pastes and grilled snacks.", "vibe": "Local, bustling, bring small notes", "id": "hkt:cherngtalay-fresh-market-talad-nat-manik-wat-manik-", "city": "hkt", "kind": "eat", "cat": "grocery"}, {"name": "Boat Avenue Fun Friday Market", "area": "Boat Avenue (between Villa Market and the lake)", "category": "grocery", "cuisine": "Weekly night market · street food, crafts, live music", "price": "฿", "approxCostPerPerson": "฿150–400 grazing", "rating": "Community favorite with expat families", "mustOrder": ["Street-food dinner — satay, grilled seafood, som tum", "Cut fruit and mango smoothies", "Coconut roti for dessert", "Small-batch crafts and prints"], "hours": "Fridays 16:00–21:00 (Fri Oct 9, 2026)", "reservation": "n/a", "gettingThere": "Walk about 5–10 min. No ride needed.", "insiderTip": "More food-and-browse than serious grocery — for produce use Tops or the Tue/Thu fresh market.", "mapsQuery": "Boat Avenue Phuket", "source": "https://www.phuket101.net/boat-avenue-mall/", "localFavorite": true, "knownFor": "Boat Avenue's Friday night market with lanterns, live music, grill stalls and small-designer crafts; it's more dinner-and-browse than a grocery run.", "vibe": "Family-friendly, lantern-lit, social", "id": "hkt:boat-avenue-fun-friday-market", "city": "hkt", "kind": "eat", "cat": "grocery", "lat": 7.996744, "lng": 98.302076, "approx": false}, {"name": "Makro Thalang", "area": "365 Moo 1, Thepkasattri Rd, Thalang", "category": "grocery", "cuisine": "Wholesale hypermarket · bulk seafood & meat", "price": "฿", "approxCostPerPerson": "Wholesale prices", "rating": "Where restaurants and villa cooks stock up", "mustOrder": ["Fresh seafood counter — prawns, fish, squid for a BBQ night", "Meat in bulk packs", "Cases of beer and water", "Cooking basics — oil, sauces, rice"], "hours": "Verify (Makro branches typically open early to late)", "reservation": "n/a", "gettingThere": "Grab/Bolt ~฿300–400, about 20 min (~12 km) inland (verify in app). Take a Grab car (not bike) and book the return ride from the entrance.", "insiderTip": "Worth it only for a big stock-up (e.g. seafood BBQ night); otherwise Tops/Villa are walking distance.", "mapsQuery": "Makro Thalang, Thepkasattri Rd, Phuket", "source": "https://www.makro.co.th/en/contact-us/75/Talang", "localFavorite": false, "thai": "แม็คโคร ถลาง", "knownFor": "The wholesale warehouse where restaurants and villa cooks stock up, known for its big fresh seafood and meat counters and bulk drinks at trade prices.", "vibe": "Warehouse, bulk, trade prices", "id": "hkt:makro-thalang", "city": "hkt", "kind": "eat", "cat": "grocery", "lat": 8.019955, "lng": 98.334264, "approx": false}], "homes": {"bkk": {"lat": 13.7385, "lng": 100.5475, "approx": true}, "hkt": {"lat": 7.9985, "lng": 98.301, "approx": true}}, "cityInfo": {"bkk": {"scams": [{"title": "'The Grand Palace is closed today'", "detail": "A friendly man near the Grand Palace or Wat Pho says it's closed for a ceremony or holiday and offers a cheap tuk-tuk to the 'Lucky Buddha'. The Grand Palace opens daily 8:30am–3:30pm. Walk to the official gate yourself and don't discuss it."}, {"title": "Gem scam", "detail": "Cheap or 'free' tours end at a gem shop with a 'government sale today', where you're told you can resell the stones at home for a profit. The stones are worthless. Losses reported to the Tourist Police often run 40,000–150,000 THB. Never buy gems on a stranger's tip."}, {"title": "The 20-baht tuk-tuk tour", "detail": "A very cheap all-day fare means commission stops at tailors and gem shops. The driver earns commissions and fuel vouchers. Agree a price to a specific destination with no stops, or use Grab or Bolt."}, {"title": "Taxi meter refusal", "detail": "Drivers waiting at tourist spots and hotels quote flat prices of 2–3x the meter. Say 'meter, khrap/kha' and flag another cab if they refuse, or book on Grab or Bolt. Bolt is often 10–25% cheaper."}, {"title": "Muay Thai touts", "detail": "Men on the road to Rajadamnern and near hotels say the fights are sold out or that foreigners need special tickets, then resell at up to 3x. Buy from the official stadium site or box office and show an e-ticket."}, {"title": "Dress-code gatekeeping", "detail": "Temples, especially the Grand Palace, require covered shoulders and knees (and ankles at the Grand Palace). No sleeveless tops, shorts or ripped jeans. Bring light long pants and a shirt with sleeves to avoid gate rental fees and being turned away. Take shoes off inside prayer halls."}, {"title": "Fake tourist info offices and 'TAT' agents", "detail": "Private shops styled as official tourist offices, often recommended by drivers, sell overpriced tours. The real TAT hotline is 1672. The Tourist Police are 1155 for scams or disputes."}, {"title": "Blue-flag and longtail upsell at Sathorn pier", "detail": "Counters and staff at Sathorn pier steer foreigners to 40–150 THB tourist boats or private longtails costing thousands. The orange-flag public express goes to the same central piers for about 17–18 THB. Board at the public queue and pay on board."}]}, "hkt": {"safety": [{"title": "Red flags are law, not advice", "detail": "October is the tail of the southwest monsoon; west-coast beaches (Bang Tao, Surin, Kata, Karon, Patong) get strong rip currents. Phuket records roughly 30-40 drownings a year, mostly tourists in the rainy season, including deaths at Kata and Bang Tao in June 2025. Lifeguards only patrol Patong, Karon, Kata, Bang Tao and Surin, in daylight. If a red flag is up, stay out, however calm it looks."}, {"title": "Jet ski damage scam", "detail": "Operators (especially on Patong) accuse renters of pre-existing damage and demand 10,000-50,000 THB. Marine police arrested operators in April 2025 but it persists. Best avoided; if you do rent, film the whole craft beforehand."}, {"title": "Tuk-tuk pricing", "detail": "Unmetered: short hops in Patong/Kata about 200-400 THB, cross-island up to ~800 THB. Agree the price first, or use Grab/Bolt - especially after drinks, when you shouldn't drive."}, {"title": "Boat trips in rough weather", "detail": "Some Phi Phi operators sail in any conditions. In early-mid October favour sheltered Phang Nga Bay trips, confirm the operator cancels/refunds for weather, and take seasickness tablets."}, {"title": "Longtail and beach deals", "detail": "For Freedom Beach and similar, agree the price per boat (not per person) and the pickup time, and pay the balance on the return leg."}, {"title": "Vegetarian Festival hazards", "detail": "Firecrackers are thrown at processions. Wear closed shoes, long sleeves and trousers, eye protection and earplugs; keep back from the mediums and don't block the procession."}], "seaConditions": "Early-to-mid October is the tail end of the southwest monsoon: expect frequent showers (about 20+ rainy days a month), usually as afternoon or evening downpours rather than all-day rain, with conditions typically improving from mid-month. The west coast (Bang Tao, Surin, Kamala, Patong, Karon, Kata) can see waves up to ~2 m, frequent red flags and dangerous rip currents, so treat beach time as looking and walking, and swim only where lifeguards show a green/yellow flag. The east and south-east side (Ao Yon, Cape Panwa) and Phang Nga Bay are sheltered and much calmer. Phang Nga Bay / James Bond Island trips are the most weather-proof boat option and often run when open-sea Phi Phi trips are cancelled. Phi Phi trips mostly operate (Maya Bay reopens Oct 1) but can be cancelled or rough. The Similan Islands NP stays closed until its typical Oct 15 reopening (verify), after you leave, so it isn't possible on this trip. Water is ~29C. Keep plans flexible: use the calmest forecast mornings for boat and beach days, and save Old Town, markets, spa and waterfalls for rough or rainy days."}}, "logistics": [{"title": "Entry Requirements", "icon": "🛂", "items": [{"label": "TDAC (Digital Arrival Card): required", "detail": "Mandatory and free for every foreign arrival since May 2025, when it replaced the paper TM6. File it within 72 hours before landing (target Sep 29–Oct 1 for an Oct 2 arrival). Each traveler files their own, or submit together as a group, then save or screenshot the QR/confirmation.", "link": "https://tdac.immigration.go.th/arrival-card/"}, {"label": "TDAC scam sites", "detail": "Thai Immigration has warned about lookalike sites charging roughly $10–90 for the free form. Use only tdac.immigration.go.th and never pay a fee. The optional THIM app (launched Aug 2026) can file the TDAC for you by scanning your passport, but it is not a separate requirement.", "link": "https://www.bangkokpost.com/thailand/general/3226524/immigration-warns-of-scam-digital-arrival-card-websites"}, {"label": "Visa exemption: now 30 days (changed Sep 15, 2026)", "detail": "The Royal Gazette (Aug 31, 2026) cut visa-free stays for US citizens from 60 to 30 days, effective Sep 15, 2026, and limited them to tourism. Your 12 nights fit easily. A one-time 30-day extension is reported at ฿1,900. Carry proof of an onward/return ticket in case you're asked (verify).", "link": "https://visasnews.com/en/thailand-to-officially-cut-visa-free-stay-to-30-days-on-september-15-2026/"}, {"label": "Passport validity", "detail": "Standard rule is 6+ months of validity and a blank page (verify on the US Embassy page).", "link": "https://th.usembassy.gov/thai-visas-for-americans/"}, {"label": "฿300 tourism entry fee: not in force (verify)", "detail": "A proposed ฿300 (about $9) fee for air arrivals was still waiting on Cabinet approval as of mid-2026, with no start date or collection method announced. Check again just before departure. There is no ETA requirement for US passports.", "link": "https://blog.wego.com/thailand-tourist-entry-fee-2026/"}]}, {"title": "Airport to Bangkok Airbnb (Witthayu Rd)", "icon": "🚕", "items": [{"label": "Airport Rail Link + BTS (cheapest)", "detail": "ARL from Suvarnabhumi (BKK) to Phaya Thai is ฿45 and about 30 min. At Phaya Thai, change to the BTS Sukhumvit line and ride direct (no transfer) to Phloen Chit, next to Witthayu Rd. Downsides: stairs and crowds with luggage, and BTS doesn't take contactless cards. Alternative: get off the ARL at Ratchaprarop or Makkasan and take a Grab of roughly ฿100 (verify).", "link": "https://thailandawaits.com/train-from-bangkok-airport/"}, {"label": "Metered taxi from BKK", "detail": "Use the official taxi queue (Level 1). You pay the meter (฿35 flag fall) plus a ฿50 airport surcharge plus expressway tolls. Central Bangkok is typically ฿300–650 all-in; expect about ฿350–450 and 35–60 min to Witthayu depending on traffic (verify). Insist on the meter.", "link": "https://www.talesoup-travel.com/en/bkk-to-bangkok/"}, {"label": "Grab from BKK", "detail": "Usually 10–25% more than a metered taxi off-peak (roughly ฿450–650, verify). Surge can add 30–50% at 7–10am, 5–8pm and in rain. Pickup is at the designated Grab point.", "link": "https://www.hootling.com/blog/how-much-does-a-taxi-cost-in-bangkok"}, {"label": "If you arrive at Don Mueang (DMK)", "detail": "A metered taxi plus the ฿50 surcharge plus tolls runs about ฿300–500 and 35–60 min to central Bangkok. Budget option: SRT Red Line to Krung Thep Aphiwat (Bang Sue), about 20 min for ฿20–33, then MRT Blue Line and a short Grab.", "link": "https://www.talesoup-travel.com/en/dmk-to-bangkok/"}, {"label": "Flood alert (late Sep 2026)", "detail": "On Sep 26, 2026 all 50 Bangkok districts were declared a disaster zone after nearly 300 mm of rain, with the east side worst hit. Check road and airport conditions before Oct 2 and leave extra time.", "link": "https://www.aljazeera.com/news/2026/9/26/disaster-zone-declared-across-bangkok-as-heavy-rain-triggers-flooding"}]}, {"title": "Bangkok to Phuket (Oct 7)", "icon": "✈️", "items": [{"label": "Airlines and airports", "detail": "From Suvarnabhumi (BKK): Thai Airways (Thai Smile was folded into Thai in 2024), Bangkok Airways and Thai VietJet. From Don Mueang (DMK): Thai AirAsia, Nok Air and Thai Lion Air. There are about 1,289 weekly flights on the route, with roughly 1h25–1h30 in the air.", "link": "https://www.thaiairways.com/flights/en/flights-from-bangkok-to-phuket"}, {"label": "Typical fares", "detail": "Budget carriers run from about $30–100 one way, with carry-on only. Thai Airways starts around ฿2,778 (about $80+) and runs up to ~$140 in early October, with checked bag included. Bangkok Airways (BKK) includes a checked bag and lounge access (verify current allowance).", "link": "https://www.expedia.com/lp/flights/dmk/hkt/bangkok-to-phuket"}, {"label": "Budget-carrier baggage traps", "detail": "Base AirAsia, Nok and Lion fares usually include only a small carry-on (about 7 kg, weighed at the gate). Prepay checked bags online, because airport add-ons cost much more. Get both of you on one booking with bags added.", "link": "https://www.skyscanner.com/routes/bkkt/hkt/bangkok-to-phuket.html"}, {"label": "Recommended timing", "detail": "Check out at 11:00 and leave straight for the airport. Aim for a flight departing about 13:30–15:00 so you land around 15:00–16:30 and reach Bang Tao after the 3pm check-in. Avoid anything before about 13:00.", "link": ""}, {"label": "Witthayu Rd to BKK vs DMK", "detail": "BKK is about 30 km, 35–60 min and ฿300–450 by taxi or Grab plus tolls. DMK is about 25 km, 35–60 min via the tollway, similar cost. Both are traffic-dependent, so leave 2.5 hours before departure for a domestic flight (verify). Choose the airport that matches your airline.", "link": ""}]}, {"title": "Phuket Airport (HKT) to Bang Tao", "icon": "🏝️", "items": [{"label": "Drive time", "detail": "Canvas Bangtao (Choeng Thale) is roughly 20–30 min from HKT by road (verify with Google Maps on the day).", "link": ""}, {"label": "Official taxi counter", "detail": "Fixed fares to Bang Tao/Laguna are about ฿400–500 per car.", "link": "https://www.evephuket.com/blog/phuket-taxi-prices-2026/"}, {"label": "Grab and Bolt", "detail": "Grab has the official pickup at HKT; airport to Bang Tao runs about ฿550–800 (Mar 2026). Bolt is often 5–30% cheaper; one Bang Tao-to-airport ride was ฿343. Surge adds 10–30% at peak times, in rain and after midnight. Phuket app rides cost more than in Bangkok.", "link": "https://phuket-travel-experience.com/guide/grab-in-phuket/"}, {"label": "Renting the Airbnb's car", "detail": "Thai law requires an International Driving Permit plus your US license (get the IDP from AAA before you go, about $20). Without one, fines are ฿1,000–2,000, and insurance claims are routinely denied. Confirm first-class insurance, the deductible and the documents in the car. Driving is on the LEFT.", "link": "https://thethaiger.com/guides/automotive/international-driving-permit-in-thailand"}, {"label": "Police checkpoints", "detail": "Phuket runs frequent checkpoints, especially around Patong, Karon and Kata. Carry your passport copy, license and IDP.", "link": "https://gogophuket.com/news/phuket-random-checkpoints-where-when-tourist-guide/"}]}, {"title": "Getting Around Bangkok", "icon": "🚇", "items": [{"label": "Grab vs Bolt", "detail": "Install both. Bolt is often 10–25% cheaper, while Grab has better coverage and more vehicle options. Bolt has been in a 2026 licensing dispute with the Department of Land Transport, so keep Grab as your fallback.", "link": "https://thaiguys.link/en/tips/bangkok-grab-bolt-guide"}, {"label": "Metered taxis", "detail": "Flag fall is ฿35. Say 'meter please' and get out if the driver refuses or quotes a flat price. Metered taxis are cheaper than apps off-peak but harder to get in rain.", "link": "https://www.bangkok-spirit.com/guides/grab-taxi-tuk-tuk-bangkok/"}, {"label": "Tuk-tuks", "detail": "A fair price for 1–2 km is about ฿40–100, but tourist-zone quotes of ฿175–525 are common. Agree the price first, and turn down 'cheap tours' (฿20–40), which detour to gem and tailor shops.", "link": "https://www.tukme.co/blogs/tuk-me-bangkok-travel-by-tuk-tuk/tuk-tuk-thailand-guide"}, {"label": "MRT: tap your card", "detail": "Visa, Mastercard and UnionPay contactless cards work on the MRT Blue, Purple, Yellow and Pink lines and on the Airport Rail Link. The old MRT cards stopped working Jun 1, 2026. MRT Lumphini, on Rama IV at the south end of Witthayu, is the closest station.", "link": "https://www.nationthailand.com/news/policy/40063062"}, {"label": "BTS Skytrain: no contactless yet", "detail": "BTS (Sukhumvit and Silom lines) still takes only a Rabbit card or single-journey tickets bought by cash or QR. Buy a Rabbit card at any BTS station (about ฿200 including stored value; verify, and bring your passport) if you'll ride often. Phloen Chit station is by Witthayu Rd.", "link": "https://whatappdoineed.com/blog/bangkok-transport-cards-2026-mrt-emv-bts-rabbit-card"}, {"label": "Khlong Saen Saep canal boat", "detail": "Fast and cheap: ฿16–26 since Apr 24, 2026, cash only, paid on board, running about 5:30am–8:30pm. The nearest piers are Chit Lom/Witthayu or Pratunam (change boats there for the Golden Mount/old town line). Expect splashes; boarding is quick.", "link": "https://thaiest.com/thailand/bangkok/khlong-boat"}]}, {"title": "Money", "icon": "💵", "items": [{"label": "ATM fees", "detail": "Thai ATMs charge foreign cards about ฿220–250 per withdrawal, and some now show ฿350 for Mastercard. AEON ATMs are cheaper at about ฿150. Withdraw larger amounts less often, and use a no-fee debit card (Schwab, etc.) that refunds the ATM charge.", "link": "https://www.thailand-atm-calculator.com/blog/thailand-atm-fees"}, {"label": "Avoid DCC", "detail": "When an ATM or card terminal offers to charge in USD, always choose THB or 'without conversion'. The dynamic currency conversion markup is poor.", "link": "https://www.chiangraitimes.com/thailand-news/thailand-atm-fees/"}, {"label": "Cards vs cash", "detail": "Bring a no-foreign-fee Visa or Mastercard; Amex is patchy. Hotels, malls, chain restaurants and Grab accept cards. Carry cash for street food, markets, tuk-tuks, canal boats, BTS tickets, massages and small shops, about ฿1,000–2,000 per day for two (verify against your plans).", "link": ""}, {"label": "Tipping", "detail": "Tipping isn't required. If the bill shows a 10% service charge ('++' on menus means 10% service plus 7% VAT), you've already tipped. Otherwise round up or leave ฿20–50, or about 10% at upscale places. Massage: ฿50–100 per hour at local shops, ฿100–200 at hotel spas.", "link": "https://www.talesoup-travel.com/en/thailand-tipping-guide/"}]}, {"title": "Phone and Data", "icon": "📶", "items": [{"label": "Local tourist eSIM (AIS / True-dtac)", "detail": "Both run 8 days for ฿499, 15 days for ฿699, or 30 days for ฿1,199. The 15-day plan covers Oct 2–14. True-dtac's plans include calls and ฿100 of international credit. Buy at the airport kiosks after baggage claim or online (confirm your phone is unlocked).", "link": "https://www.true.th/en/prepaid/sim/tourist"}, {"label": "Airalo / other eSIMs", "detail": "Install before departure so you have data on landing; they use AIS, True or dtac networks. They're data-only, often without a Thai number, which matters for some app OTPs. Prices vary, so compare (verify).", "link": "https://mestogo.com/en/best-thailand-esim-tourists-2026/"}]}, {"title": "Weather and What to Pack", "icon": "🌦️", "items": [{"label": "Bangkok, early October", "detail": "Highs of 31–35°C (87–95°F), lows around 24–27°C, very humid. Expect 15–22 rainy days in the month (about 190–240 mm), usually as afternoon or evening downpours. Streets can flood briefly, and 2026 has already been severe.", "link": "https://www.accuweather.com/en/th/bangkok/318849/october-weather/318849"}, {"label": "Phuket, October", "detail": "This is the tail of the southwest monsoon, one of the wettest months: about 320 mm over roughly 22 rain days, mostly afternoon showers. West-coast waves reach up to 2 m in early October. Red flags at Bang Tao mean no swimming, so swim only between the red-and-yellow flags.", "link": "https://www.phuket101.net/phuket-weather-in-october/"}, {"label": "Packing", "detail": "Pack a light rain shell or compact umbrella, quick-dry clothes, sandals that can get wet, DEET repellent, reef-safe sunscreen, a dry bag for phones, and a power bank. Thailand uses 220V with type A/B/C outlets, so US plugs usually fit, but check your devices are dual-voltage.", "link": ""}, {"label": "Temple dress code", "detail": "Cover shoulders and knees (no tank tops, shorts or short skirts), and take shoes off inside halls. The Grand Palace is strictest: no tight or see-through clothing, and you'll need long pants or a long skirt. Carry a sarong or scarf.", "link": ""}]}, {"title": "Holidays and Events (Oct 2–14)", "icon": "📅", "items": [{"label": "Oct 13 (Tue): King Bhumibol Memorial Day", "detail": "National public holiday. Government offices and banks close, with possible memorial crowds around Sanam Luang and the Grand Palace area. It's not a standard nationwide alcohol-ban day (verify).", "link": ""}, {"label": "Ok Phansa: Oct 26, 2026 (outside your trip)", "detail": "The end of Buddhist Lent and its alcohol-sales ban fall after you leave. No statutory dry days are expected Oct 2–14 (verify).", "link": "https://www.thaiholidayguide.com/events/ok-phansa/"}, {"label": "Phuket Vegetarian Festival: Oct 10–18, 2026", "detail": "Overlaps your Phuket stay. There are street processions with firecrackers and piercing rituals in Phuket Old Town, mainly around Jui Tui Shrine. The pole-raising is the evening of Oct 9 and the opening is at midnight Oct 10. Expect Old Town traffic closures, and look for yellow-flag vegetarian food stalls. Some sources give Oct 9–19, so verify the daily schedule.", "link": "https://www.phuket101.net/phuket-vegetarian-festival/"}]}, {"title": "Apps and Emergency Contacts", "icon": "📱", "items": [{"label": "Apps to install", "detail": "Grab and Bolt (rides and food), LINE (the messaging app Thais use), Google Maps and Google Translate (download Thai offline), Hungry Hub and Eatigo (restaurant deals), Klook (tours and tickets), 12Go (transport), your airline's app, and THIM (optional TDAC).", "link": ""}, {"label": "Emergency numbers", "detail": "Tourist Police: 1155 (English, 24/7). Police: 191. Ambulance/EMS: 1669. Fire: 199.", "link": ""}, {"label": "US Embassy Bangkok", "detail": "95 Wireless Rd (Witthayu), Bangkok 10330, on the same road as your Airbnb, near BTS Phloen Chit. American Citizen Services: +66 2-205-4049. 24/7 emergency: +66 2-205-4000. Email: acsbkk@state.gov. Enroll in STEP before you go.", "link": "https://th.usembassy.gov/acs-bangkok/"}]}, {"title": "Health", "icon": "🏥", "items": [{"label": "Water", "detail": "Don't drink tap water. Use bottled, sealed or filtered water; the tube ice with a hole in restaurants is generally commercial and safe.", "link": "https://www.ncbi.nlm.nih.gov/books/n/yellowbook/thailand/"}, {"label": "Mosquitoes and dengue", "detail": "21,620 dengue cases and 31 deaths nationwide by Aug 19, 2026 (1,785 in Bangkok), and October's rains are peak season. Use DEET or picaridin, especially at dawn and dusk, and see a doctor for sudden high fever.", "link": "https://aseannow.com/thailand-news/thailand-2026-dengue-cases-reach-21620-with-31-deaths-r3492"}, {"label": "Pharmacies", "detail": "Boots, Watsons and Fascino are everywhere, and pharmacists speak basic English. Many medicines are sold over the counter. Bring your prescriptions in original packaging.", "link": ""}, {"label": "Hospitals near Witthayu Rd", "detail": "Bumrungrad International (Sukhumvit Soi 3, about 2–3 km). BNH Hospital (Convent Rd, Silom, about 2 km). King Chulalongkorn Memorial Hospital (Rama IV, near Lumphini, the closest large public hospital). Distances approximate (verify).", "link": ""}, {"label": "Hospitals and clinics near Bang Tao", "detail": "Bangkok Hospital Phuket runs a clinic in Laguna/Bang Tao for minor issues. Its main hospital is at 2/1 Hongyok Utis Rd, Phuket Town, about 30–45 min drive (verify). Call 076-254-421 or hotline 1719. Sainamyen International Clinic is also in Bang Tao. Carry travel medical insurance, since private hospitals require payment or a guarantee.", "link": "https://www.bangkokhospital.com/en/phuket/center-clinic/trauma/bangkok-phuket-clinic-bpk/risk-assessment"}]}], "phrases": [{"thai": "สวัสดีครับ / ค่ะ", "phonetic": "sa-wat-dee khrap (male speaker) / kha (female speaker)", "meaning": "Hello / goodbye (add khrap or kha to be polite)"}, {"thai": "ขอบคุณครับ / ค่ะ", "phonetic": "khop khun khrap / kha", "meaning": "Thank you"}, {"thai": "เท่าไหร่", "phonetic": "tao rai?", "meaning": "How much?"}, {"thai": "ไม่เผ็ด / เผ็ดนิดหน่อย", "phonetic": "mai phet / phet nit noi", "meaning": "Not spicy / a little spicy"}, {"thai": "อร่อยมาก", "phonetic": "a-roy mak", "meaning": "Very delicious (vendors love hearing it)"}, {"thai": "ไม่เอาครับ / ค่ะ", "phonetic": "mai ao khrap / kha", "meaning": "No thanks, I don't want it (useful with touts)"}, {"thai": "ไม่เป็นไร", "phonetic": "mai pen rai", "meaning": "No problem / never mind (a key Thai attitude)"}, {"thai": "ห้องน้ำอยู่ที่ไหน", "phonetic": "hong nam yoo tee nai?", "meaning": "Where is the bathroom?"}, {"thai": "เช็คบิล", "phonetic": "check bin", "meaning": "The bill, please"}, {"thai": "ไปเปิดมิเตอร์", "phonetic": "bpert meter", "meaning": "Turn on the meter (for taxis)"}], "events": [{"date": "2026-10-02 (Fri)", "name": "Royal Barge Procession rehearsal (minor)", "detail": "Free to watch from both banks between the Krung Thon / Rama VIII bridges and Wat Arun, from about 2:30pm. Express boat service is modified during rehearsals. Rehearsals lead up to the Royal Kathin procession on Nov 6. The next rehearsal is Oct 8, after your stay.", "source": "https://www.tatnews.org/2026/08/thailand-invites-visitors-to-witness-the-royal-barge-procession-2026-and-rehearsals-on-bangkoks-chao-phraya-river/", "city": "bkk", "iso": "2026-10-02"}, {"date": "2026-10-03 (Sat)", "name": "ONE Fight Night 48, Lumpinee Boxing Stadium", "detail": "A major ONE Championship card at Lumpinee Stadium, Ram Inthra (north Bangkok, not Lumphini Park). Check start time and ticket prices on ONE's official channels (verify).", "source": "https://en.wikipedia.org/wiki/2026_in_ONE_Championship", "city": "bkk", "iso": "2026-10-03"}, {"date": "2026-10-03 to 10-04 (Sat–Sun)", "name": "Your only weekend: Chatuchak, Bang Nam Phueng, RWS Muay Thai", "detail": "These run on weekends only or are best at the weekend: Chatuchak Weekend Market, the Bang Nam Phueng market in Bang Krachao (about 8am–4pm), and Saturday-night Rajadamnern World Series (RWS) Muay Thai.", "source": "https://outthailand.com/guide/chatuchak-weekend-market/ ; https://www.bucketlistly.blog/posts/bang-krachao-travel-guide-things-to-do ; https://muaythaistadiums.com/rajadamnern-muay-thai-stadium/", "city": "bkk", "iso": "2026-10-03"}, {"date": "2026-10-02 to 10-07", "name": "No Thai public holidays during your stay", "detail": "Nothing national falls Oct 2–7, so there are no alcohol-sale bans or holiday closures to plan around. The nearest holidays are Oct 13 (King Bhumibol Memorial Day) and Oct 23 (Chulalongkorn Day), both after you leave (verify). Buddhist Lent runs to Ok Phansa on Oct 26.", "source": "https://www.thaiholidayguide.com/events/ok-phansa/ ; https://globalholidayscalendar.com/countries/thailand/2026", "city": "bkk", "iso": "2026-10-02"}, {"date": "Oct 9, 2026 (Fri)", "name": "Vegetarian Festival Go Teng pole raising", "detail": "Lantern poles raised at all participating shrines ~4-6 pm, with evening events and a midnight ceremony opening the festival.", "source": "https://www.jamiesphuketblog.com/2016/04/phuket-vegetarian-festival-schedule.html", "city": "hkt", "iso": "2026-10-09"}, {"date": "Oct 9, 2026 (Fri)", "name": "Fun Friday Avenue market, Boat Avenue", "detail": "Weekly Friday night market at the Laguna entrance, ~4-9/10 pm.", "source": "https://www.phuket101.net/boat-avenue-mall/", "city": "hkt", "iso": "2026-10-09"}, {"date": "Oct 10-18, 2026", "name": "Phuket Vegetarian Festival (Nine Emperor Gods)", "detail": "Nine days of ritual across ~9 shrines; jay food everywhere (yellow flags); wear white; free. Your stay covers Oct 10-14.", "source": "https://www.phuket101.net/phuket-vegetarian-festival/", "city": "hkt", "iso": "2026-10-10"}, {"date": "Oct 11, 2026 (Sun)", "name": "Naka Shrine procession + Sunday Walking Street", "detail": "Naka procession ~7:30 am; Lard Yai Walking Street on Thalang Road ~4-10 pm; Naka Weekend Market Sat-Sun 4-10 pm.", "source": "https://www.phuket101.net/phuket-vegetarian-festival/ ; https://www.phuket101.net/phuket-walking-street/", "city": "hkt", "iso": "2026-10-11"}, {"date": "Oct 12, 2026 (Mon)", "name": "Sapam Shrine procession", "detail": "~7:20 am along Thepkasattri Rd to Saphan Hin (~10 km); piercings before 7 am. Kathu Birth/Death Gods procession around 7 pm (verify).", "source": "https://www.phuket101.net/phuket-vegetarian-festival/ ; https://www.jamiesphuketblog.com/2016/04/phuket-vegetarian-festival-schedule.html", "city": "hkt", "iso": "2026-10-12"}, {"date": "Oct 13, 2026 (Tue)", "name": "King Bhumibol (Rama IX) Memorial Day - national holiday + Sam Kong procession", "detail": "Public holiday; government offices/banks closed. Past Oct 13 alcohol bans came from Ok Phansa falling on that date; the memorial day itself carries no legal ban. In 2026 Ok Phansa is Oct 26, so a ban is unlikely - verify locally, and expect a more subdued mood. Sam Kong Shrine procession ~7:45 am.", "source": "https://www.officeholidays.com/countries/thailand/2026 ; https://thethaiger.com/hot-news/events/alcohol-sales-ban-in-thailand-on-sunday-october-13 ; https://www.phuket101.net/phuket-vegetarian-festival/", "city": "hkt", "iso": "2026-10-13"}, {"date": "Oct 14, 2026 (Wed)", "name": "Tha Rua Shrine procession (departure day)", "detail": "Tha Rua procession ~6:09 am in Thalang, on the airport side of the island - a good last-morning option. Jui Tui fire-walking that evening (~8 pm) clashes with the 23:25 HKT flight (be at the airport ~20:30), so skip it.", "source": "https://www.phuket101.net/phuket-vegetarian-festival/", "city": "hkt", "iso": "2026-10-14"}, {"date": "Oct 1, 2026 onward", "name": "Maya Bay (Phi Phi) reopened", "detail": "Closed Aug 1-Sep 30 for rehabilitation; expected to reopen Oct 1, 2026.", "source": "https://www.phuket101.net/maya-bay-in-phi-phi-island/", "city": "hkt", "iso": "2026-10-01"}], "verdicts": {"boat": "For Oct 8-13, do John Gray's Hong by Starlight. Phang Nga Bay is sheltered by its karst islands and runs in almost any October weather, while the exposed west-coast crossings to Phi Phi and Racha are the ones that get cancelled or turn rough (the Similans stay closed until ~Oct 15). It's also the most memorable day on offer: sea-cave hongs by canoe, sunset dinner, and bioluminescent plankton, with the dark nights around the ~Oct 10 new moon ideal (verify). Pickup from Canvas Bangtao is included, and it costs ฿3,350-3,950 pp. Book it for Oct 8 or 9 so a weather reschedule is possible. Backup: Phuket Sail Tours' James Bond Sunset (฿4,400 pp all-in, max 20, you land on James Bond Island), or Simba's small-group Phang Nga speedboat if you prefer an early day. Rainy-day plan: Phang Nga trips still run in rain, and caves are fun wet. Only reschedule if the operator does, and skip Phi Phi unless the forecast is flat.", "elephant": "Do Phuket Elephant Sanctuary's Half Day program (฿3,000 pp, morning session, shuttle pickup from the Laguna/Bang Tao area at 09:00). Since April 2026 it has been fully observation-only, making it the most ethical option in Phuket or Bangkok, and it fits easily on a non-boat day. If it's full, Phuket Elephant Nature Reserve (฿3,500 pp with transport, independently audited, hands-off) is an excellent alternative. Skip the hands-on bathing and mud-spa camps near your hotel (Green Elephant, Elephant Jungle Sanctuary, Elephant Retirement Park) and the ~12-hour Kanchanaburi day trips from Bangkok. Avoid Elephantstay in Ayutthaya entirely because it involves riding."}, "fightNights": [], "splitDays": [], "lounges": {"legs": [{"date": "2026-09-30", "airport": "PHX", "terminal": "Terminal 3 (United's PHX terminal; E/F gates; United Club is near gate E3, which confirms United is in T3. Check the exact gate on the day)", "when": "before UA 5969 18:40 (United Express, economy)", "lounges": [{"name": "Escape Lounge PHX Terminal 3", "access": "Priority Pass", "location": "Terminal 3, airside, central hall between the E and F gates, just above the TSA checkpoint", "hours": "04:30-22:00 daily", "known_for": "A real lounge, not a restaurant. Made-to-order menu plus a small buffet, open bar with local drinks, and locally roasted coffee. It is small and often runs a virtual waitlist.", "verdict": "Use this", "note": "PP lists a 3-hour maximum stay. PP says members can pre-book. Get there early (around 16:30-17:00), because capacity and waitlists are common. You also get free entry with Amex Platinum.", "source": "https://www.prioritypass.com/en-GB/lounges/united-states-of-america/phoenix-sky-harbor-international/phx6-escape-lounges ; https://thriftytraveler.com/reviews/airport-lounges/escape-lounge-phoenix-terminal-3/"}, {"name": "United Club PHX", "access": "United Club membership or day pass only. Probably NOT included: Polaris access rules give United Club entry at the long-haul departure/arrival airport, not on the domestic feeder (verify with United)", "location": "Terminal 3, airside, near gate E3", "hours": "verify", "known_for": "Small (~6,000 sq ft), snack buffet, full bar, gelato machine; gets crowded", "verdict": "Skip", "note": "Ask at the door with your same-day Polaris itinerary. If they let you in, it's a bonus, but don't plan on it.", "source": "https://loungereview.com/lounges/united-club-phx-terminal-3/ ; https://thepointsguy.com/news/united-club-phoenix/"}], "tip": "PP lists only one PHX location: Escape Lounge T3. There are no PP restaurants at PHX. It's the right terminal and it's airside, so you can use it."}, {"date": "2026-09-30", "airport": "LAX", "terminal": "Terminal 7 (United; UA 820 expected T7, verify gate). UA 5969 United Express may arrive at T7 or T8 (verify).", "when": "connection: arrive 20:19 on UA 5969, depart UA 820 23:45 (Polaris business)", "lounges": [{"name": "United Polaris Lounge LAX", "access": "United Polaris (included)", "location": "Terminal 7, airside, between gates 73 and 75A", "hours": "06:30-22:30 daily (One Mile at a Time and several 2025-2026 sources). It closes BEFORE the 23:45 departure, so you'll have about 2 hours (roughly 20:30-22:30). Verify whether hours are extended for UA 820.", "known_for": "Smallest Polaris lounge (~12,000 sq ft). Sit-down à la carte dining room (~16 seats), buffet, full-service bar, shower suites, 2 nap/quiet rooms", "verdict": "Use this", "note": "Each traveler needs their own same-day Polaris long-haul ticket. Polaris ticket holders get NO guests. A domestic connection on the same ticket (UA 5969) still works: you use the lounge at the long-haul gateway (LAX). Go straight here after landing. Put your name down for the dining room and a shower right away, before the 22:30 close.", "source": "https://onemileatatime.com/guides/united-polaris-lounges/ ; https://www.businesstraveller.com/tried-tested/lounge-review-united-polaris-lounge-lax/ ; https://travelupdate.com/review-united-polaris-lounge-los-angeles-lax/"}, {"name": "United Club LAX Terminal 7", "access": "United Club (included with Polaris ticket; United grants United Club access to Polaris long-haul passengers, verify)", "location": "Terminal 7, airside. T7 and T8 are connected airside.", "hours": "05:45-23:30 (verify)", "known_for": "Large club with an outdoor terrace, bar and snacks. Reviews say no showers.", "verdict": "Backup", "note": "Go here after the Polaris Lounge closes at 22:30 and stay until boarding (about 23:00).", "source": "https://www.earlybirdair.com/lounges/california/los-angeles-lax/united-club-terminal-7 ; https://wandermileage.com/2026/03/23/united-club-lax-terminal-7-review/"}, {"name": "Virgin Atlantic Clubhouse LAX", "access": "Priority Pass + US$35 per-person upgrade fee (guests also pay)", "location": "Tom Bradley International Terminal, airside, 6th floor via the elevator near the clock tower", "hours": "08:00-22:30; PP access may be limited 12:30-16:00 and 18:30-22:00", "known_for": "À la carte dining and a cocktail bar", "verdict": "Skip", "note": "Pointless with Polaris access. It also closes at 22:30.", "source": "https://www.prioritypass.com/en-GB/lounges/united-states-of-america/los-angeles-international"}], "tip": "You shouldn't need to re-clear security: T7 and T8 are connected airside, and all LAX terminals are now linked post-security. Check the arrival and departure gates on the United app. PP has nothing useful in T7/T8. The only PP spots at LAX are the Virgin Clubhouse (TBIT, extra fee), Gameway T3/T6 and Be Relax spa."}, {"date": "2026-10-01/02", "airport": "HKG", "terminal": "Terminal 1 (tech/fifth-freedom stop ~2h; estimated arrival ~05:45-06:00 local, departure ~07:45, verify times)", "when": "UA 820 through-stop en route to BKK", "lounges": [{"name": "United Club Hong Kong", "access": "United Polaris / Star Alliance business on a same-day departing Star Alliance flight (verify whether through passengers get in)", "location": "Terminal 1, airside, near gate 60, mezzanine level", "hours": "06:00-23:30 (verify)", "known_for": "Reopened October 2025. Showers, Asian and Western buffet, workspaces, airfield views", "verdict": "Use this", "note": "Only relevant if through passengers must deplane. It opens ~06:00, which may be right at arrival.", "source": "https://lastmanboarding.com/2025/11/01/new-lounge-review-united-club-hongkonghkg/ ; https://loungereview.com/lounges/united-club-hkg/"}, {"name": "Plaza Premium Lounge (near Gate 35)", "access": "Priority Pass", "location": "Terminal 1, airside, Level 6 departures, near gate 35", "hours": "06:00-01:00", "known_for": "Hot food including a noodle station, bar. Showers may cost extra (verify).", "verdict": "Backup", "note": "PP lists a 2-hour maximum stay. HKG has other Plaza Premium locations (e.g. near gate 1/60); check the PP app for which ones are in PP.", "source": "https://www.prioritypass.com/lounges/hong-kong-sar/hong-kong-chek-lap-kok-intl/hkg4-plaza-premium-lounge ; https://www.pointsbrotherhood.com/hong-kong-airport-lounge-guide/"}], "tip": "Same aircraft (787-9) continues to BKK with a crew change. I couldn't confirm whether through passengers must deplane at HKG (verify). Ask the gate agent at LAX or United; tag stops often require deplaning with all belongings and re-screening at HKG transfer security. If you stay onboard, no lounge."}, {"date": "2026-10-02", "airport": "BKK", "terminal": "Suvarnabhumi international arrivals", "when": "arrive 09:35 on UA 820", "lounges": [], "tip": "There's no useful PP arrivals lounge. PP says Miracle Lounge service isn't available to arriving passengers. Go straight to immigration. PP lists a 'Fast Track' product at some Thai airports; check the app."}, {"date": "2026-10-07", "airport": "BKK", "terminal": "Suvarnabhumi domestic departures (if flying Thai / Thai Smile / Bangkok Airways, verify)", "when": "domestic flight to HKT (not booked yet)", "lounges": [{"name": "The Coral Executive Lounge (Domestic Concourse A)", "access": "Priority Pass", "location": "Domestic Concourse A, airside, Level 2", "hours": "05:00-22:00 (verify)", "known_for": "Thai food and drinks, free 15-minute shoulder massage (if available), luggage storage. Reviews say no restrooms inside.", "verdict": "Use this", "note": "Only for departures from domestic Concourse A.", "source": "https://www.prioritypass.com/en-GB/lounges/thailand/suvarnabhumi/bkk19-the-coral-executive-lounge ; https://theairportloungebro.com/the-coral-executive-lounge-bangkok-domestic-terminal-review/"}, {"name": "Miracle Lounge (Domestic Concourse D)", "access": "Priority Pass", "location": "Domestic Concourse D, airside, 2nd floor. Turn left after security, ~60 m on the left.", "hours": "05:30-22:00", "known_for": "Buffet plus alcoholic drinks", "verdict": "Use this", "note": "PP lists a 2-hour maximum stay and unlimited guests per cardholder.", "source": "https://www.prioritypass.com/lounges/thailand/bangkok-suvarnabhumi-intl/bkk17-miracle-lounge"}], "tip": "Both BKK domestic lounges are real lounges, not restaurants. Pick whichever is in your concourse."}, {"date": "2026-10-07", "airport": "DMK", "terminal": "Don Mueang Terminal 2 (domestic; AirAsia / Nok / Thai Lion)", "when": "alternative: domestic flight to HKT (not booked yet)", "lounges": [{"name": "The Coral Executive Lounge (T2 Domestic)", "access": "Priority Pass", "location": "Terminal 2 domestic departures, airside, 3rd floor. Turn right after security toward gate 51.", "hours": "05:00-22:00 per PP list (a 3rd-party page says 05:30-22:00; verify)", "known_for": "Standard Thai contract lounge: snacks, hot dishes, drinks", "verdict": "Use this", "note": "", "source": "https://www.prioritypass.com/en-GB/lounges/thailand/don-mueang-international ; https://www.americanexpress.com/en-us/travel/lounges/the-platinum-card/DMK/The-Coral-Executive-Lounge-Terminal-2-Domestic-yUFmUvPEqu"}, {"name": "Miracle Lounge (T2 Domestic)", "access": "Priority Pass", "location": "Terminal 2 domestic, airside, 3rd floor near gate 51", "hours": "05:30-20:00", "known_for": "Buffet and drinks", "verdict": "Backup", "note": "2-hour maximum stay (3rd-party source)", "source": "https://www.prioritypass.com/en-GB/lounges/thailand/don-mueang-international ; https://www.loungepair.com/guides/don-mueang-airport-paid-lounges-ultimate-guide/"}, {"name": "The Coral Forest Lounge (T2)", "access": "Priority Pass", "location": "Terminal 2, airside (exact gate: verify)", "hours": "05:00-20:00", "known_for": "verify", "verdict": "Backup", "note": "", "source": "https://www.prioritypass.com/lounges/thailand/bangkok-don-mueang-intl/dmk7-the-coral-executive-lounge"}], "tip": "DMK T2 has several PP lounges. They're all real lounges and clustered near gate 51."}, {"date": "2026-10-14", "airport": "HKT", "terminal": "Phuket International Terminal", "when": "before KE 678 23:25 (economy)", "lounges": [{"name": "The Coral Finest Business Class Lounge (Vista)", "access": "Priority Pass", "location": "International terminal, airside, near gate 11 (verify)", "hours": "06:00-00:00", "known_for": "More open space with views. Snacks and drinks; per a 3rd-party review, alcohol may cost extra (verify).", "verdict": "Use this", "note": "Open past the 23:25 departure", "source": "https://www.prioritypass.com/en-GB/lounges/thailand/phuket-international/hkt4-coral-premium-departure-lounge ; https://upgradedpoints.com/travel/airports/coral-premium-departure-lounge-phuket-hkt-review/"}, {"name": "The Coral Executive Lounge (International)", "access": "Priority Pass", "location": "International departures, airside, 4th floor, nearest gate 15 (per PP; a 3rd-party page says 3rd floor near gate 11, verify)", "hours": "09:00-00:00 (PP)", "known_for": "Snacks, beer only, free 15-minute massage when staff are available. Crowded, 3.5/5 on PP.", "verdict": "Backup", "note": "3-hour maximum stay", "source": "https://www.prioritypass.com/en-GB/lounges/thailand/phuket-international/hkt2-the-coral-executive-lounge"}, {"name": "Fast Pass (security fast track)", "access": "Priority Pass", "location": "International terminal", "hours": "verify", "known_for": "Priority security lane", "verdict": "Use this", "note": "Check in the PP app whether it uses one of your visits", "source": "https://www.prioritypass.com/en-GB/lounges/thailand/phuket-international/hkt0ft-fast-pass"}], "tip": "Neither PP lounge at HKT has confirmed showers. After an 11:00 check-out, book day-use or late check-out, or use the pool shower. Options: Phuket Airport Hotel (~0.25 mi from the terminal, free 24h shuttle); Maya Phuket Airport Hotel (walkable; one review mentions a pool shower with towels and 1,500 THB late check-out). Contact hotels directly for day-use rates."}, {"date": "2026-10-15", "airport": "ICN", "terminal": "Terminal 2 (Korean Air; verify)", "when": "transit 07:35-14:30 (6h55) on Korean Air", "lounges": [{"name": "Matina Lounge T2", "access": "Priority Pass", "location": "Terminal 2, airside. Take the escalator near gate 252 to the 4th floor and cross the bridge.", "hours": "06:00-22:00 (food 06:00-21:30)", "known_for": "Best PP buffet at ICN, with Korean and international food; beer and wine only. 4.4/5 on PP.", "verdict": "Use this", "note": "3-hour maximum stay; same-day boarding pass required", "source": "https://www.prioritypass.com/en-GB/lounges/south-korea/incheon-international/icn13-matina"}, {"name": "Sky Hub Lounge T2 (East Wing)", "access": "Priority Pass", "location": "Terminal 2, East Wing, airside, 4th floor near gate 268", "hours": "00:00-21:30 and 22:00-23:59 (essentially 24h)", "known_for": "Buffet, alcohol, 4.4/5 on PP", "verdict": "Use this", "note": "PP lists a 5-hour maximum stay. Split the layover: about 3h at Matina plus a few hours here.", "source": "https://www.prioritypass.com/en-GB/lounges/south-korea/incheon-international/icn14-sky-hub-lounge"}, {"name": "Free transit showers and nap zones (T2)", "access": "Free (airside)", "location": "Terminal 2, 4th floor near gate 231 and gate 268", "hours": "verify", "known_for": "Free showers (toiletries and hair dryer; bring or rent a towel), reclining nap loungers", "verdict": "Use this", "note": "", "source": "https://askkoreatravel.com/sleeping-at-incheon-airport-2026-capsule/"}, {"name": "Walkerhill Transit Hotel T2 / Darakhyu capsule hotel T2", "access": "Paid", "location": "Transit Hotel is airside, opposite gate 251. Darakhyu T2 location: verify whether it's landside, which would require entering Korea.", "hours": "24h (verify)", "known_for": "Transit Hotel: full rooms sold in 6-hour blocks. Darakhyu: capsules with day-use from a 3-hour minimum, ~65,000-80,000 KRW overnight as of early 2026.", "verdict": "Backup", "note": "Worth it after a red-eye if you want a real bed", "source": "https://kuncleguide.com/incheon-airport-transit-hotel/ ; https://www.walkerhill.com/darakhyu/t2/en/about/Introduction.jsp"}], "tip": "Incheon Transit Tour: a free guided tour for layovers of 4-24h; register at the transit tour desk (official page airport.kr). With 6h55 and an 07:35 arrival, only a short (1-hour or roughly 3-hour) tour realistically fits, and you'd have to clear immigration and security again. US citizens are K-ETA-exempt through 31 Dec 2026, but an e-Arrival Card is required to enter. Check the 2026 tour schedule: https://www.airport.kr/ap_en/1472/subview.do"}, {"date": "2026-10-15", "airport": "LAX", "terminal": "Arrive TBIT (Korean Air, KE 017 09:40); depart Terminal 3 (Delta / Delta Connection DL 3894 13:49; verify T3 vs T2)", "when": "clear customs at TBIT, then DL 3894 to PHX", "lounges": [{"name": "Delta Sky Club LAX T3", "access": "Not included (main cabin economy). Needs Delta One / Sky Club membership / eligible Amex card or status.", "location": "Terminal 3, airside", "hours": "verify", "known_for": "Sky Deck, indoor/outdoor bar, showers", "verdict": "Skip", "note": "Only if one of you has an eligible Amex (Platinum / Delta Reserve) with Delta same-day travel. Check current Amex visit limits.", "source": "https://news.delta.com/deltas-new-terminal-3-lax-featuring-show-stopping-delta-sky-club-now-open"}, {"name": "Gameway LAX Terminal 3", "access": "Priority Pass", "location": "Terminal 3, airside (gate: verify)", "hours": "05:00-22:00", "known_for": "Video-game lounge with seating and drinks for purchase. Not a food lounge.", "verdict": "Backup", "note": "The only PP option in T3", "source": "https://www.prioritypass.com/en-GB/lounges/united-states-of-america/los-angeles-international"}, {"name": "Virgin Atlantic Clubhouse (TBIT)", "access": "Priority Pass + US$35 per-person upgrade fee", "location": "TBIT airside, 6th floor via the elevator near the clock tower", "hours": "08:00-22:30; PP access may be limited 12:30-16:00", "known_for": "Proper dining and bar", "verdict": "Backup", "note": "After customs you exit landside, so you'd have to clear TSA at TBIT to use it. You could then walk to T3 airside via the new T3-TBIT connector. With about 4h and 2 × $35, it's optional.", "source": "https://www.prioritypass.com/lounges/usa/los-angeles-ca-lax-intl/lax23-virgin-atlantic-clubhouse---additional-fee-applies"}], "tip": "Separate tickets (KE and DL): after customs you exit to the TBIT landside curb, so you must re-check bags and clear TSA. Clearing TSA at TBIT lets you use the new airside T3-TBIT connector (Delta Sky Way) to walk to Delta's gates. Allow at least 2h for customs, bag re-check and security."}], "general": [{"label": "Digital card", "detail": "Add the Priority Pass digital membership card in the PP app for each traveler. Most lounges above (Matina, Sky Hub, Miracle, Plaza Premium) accept digital cards. Each traveler needs their own card, or pays as a guest."}, {"label": "Guest fees", "detail": "Guest rules depend on the card that issued your PP. Some cards include 1-2 free guests; others charge a guest fee (commonly ~US$35 per visit). Check your card's terms before the trip."}, {"label": "Restaurants vs lounges", "detail": "Many US card-issued PP memberships (e.g. Chase Sapphire Reserve, Amex Platinum) no longer include PP restaurant credits. Every PP option on this list is a real lounge, a spa/gaming experience (Gameway, Be Relax) or fast track. None are restaurants."}, {"label": "Time limits", "detail": "Maximum stays per PP: Escape PHX 3h, Coral HKT 3h, Matina ICN 3h, Sky Hub ICN 5h, Miracle BKK and Plaza Premium HKG 2h. Enforcement varies."}, {"label": "Same-day boarding pass", "detail": "All lounges require a same-day departing boarding pass. PP isn't valid on arrival (e.g. Miracle BKK)."}, {"label": "Polaris access", "detail": "The Polaris lounge is only open to a traveler holding a same-day Polaris long-haul ticket (each of you needs your own), and allows no guests. LAX Polaris closes at 22:30 (verify), so switch to the T7 United Club for the last hour before the 23:45 departure."}, {"label": "Verify before travel", "detail": "Lounge hours and PP participation change often. Re-check each lounge in the PP app within 48h of each flight, especially HKT Vista vs Executive, DMK Coral Forest, and whether you deplane at HKG on UA 820."}]}, "hktTransport": {"summary": "Use Grab as the default for almost every trip: it has official pickup at HKT, works fine from Bang Tao/Cherngtalay, and gives you a fixed price before you ride. Check Bolt too, because it is often 10–30% cheaper, but its Thai licence was under review in 2026 (verify it still runs in Phuket in October). Keep tuk-tuks for short hops you negotiate first, like Canvas to Boat Avenue or Surin, and let tour operators handle boat and day-tour transfers, since hotel pickup is almost always included. For a long day that combines Old Town, Big Buddha and Wat Chalong, or Phang Nga by road, a private driver at about ฿2,000–3,500/day is usually better value and less hassle than 4–5 separate app rides.", "items": [{"label": "Grab (default choice)", "detail": "Works island-wide, including Bang Tao and Laguna. Grab is the only app with official pickup inside HKT airport. Prices are shown before you book, but surge is common in the morning and evening, in rain, late at night and in Patong. Set the pickup pin at Canvas Bangtao's lobby on Pasak-Koktanod Rd, not inside the Laguna gates. Book GrabCar (4-seat) for two people. GrabBike is not recommended for tourists on Phuket roads.", "link": "https://phuketexpatguide.com/blog/phuket-grab-taxi-guide/"}, {"label": "Bolt (cheaper, licence status: verify)", "detail": "Field tests in May 2026 found Bolt about 20–30% cheaper than Grab (e.g. Patong→Bang Tao ~฿450 vs ~฿600 on Grab). In April 2026 the DLT threatened not to renew Bolt's operating licence (2,193 legal cases). A September 2026 report still lists Bolt among the 8 registered ride-hailing apps. From 1 Oct 2026, stricter rules mean only licensed drivers get jobs, so expect fewer cars at times. Bolt does not have official in-terminal airport pickup, so you may have to walk to a meeting point. Verify it works before relying on it.", "link": "https://phukettravel101.com/grab-vs-bolt-indrive-guide"}, {"label": "Oct 2026 ride-hailing rule change", "detail": "From 1 Oct 2026 the Ministry of Transport enforces driver-licence and vehicle rules on all apps (Grab, Bolt, inDrive and others), with a quarterly scoring system and possible suspensions. Riders book the same way, but there may be fewer drivers and higher prices at peak times. Verify on arrival.", "link": "https://huahin.localplus.city/2026/09/25/new-ride-hailing-rules-take-effect-october-1/"}, {"label": "Tuk-tuks (red/colored mini-trucks)", "detail": "No meters, so always agree the price before you get in. Let the driver quote first, then counter at 60–70% and be ready to walk away. 2026 guide prices: Bang Tao→Surin ฿200–350; Patong→Kamala ฿400–600; Patong→Phuket Town ฿600–900; any area→airport ฿1,000–1,500; short hops inside Patong ~฿200. Prices run 15–30% higher in peak season and late at night. Avoid 'cheap/free ride' offers that stop at gem or tailor shops. Some zones (Patong, beach ranks, hotel fronts) have local taxi/tuk-tuk groups that put pressure on app drivers, who may ask you to walk a bit for pickup (verify locally).", "link": "https://phuketexpatguide.com/blog/tuk-tuk-prices-phuket/"}, {"label": "Phuket Smart Bus (Route 1: Airport ⇄ Rawai)", "detail": "Flat fare ฿100/person, any distance. Pay by cash, contactless Visa/Mastercard/JCB, Thai QR (PromptPay) or Rabbit card. Day passes from ฿299. Runs roughly hourly on the west coast: Airport → Cherng Talay School → Laguna → Lotus Cherng Talay → Surin → Kamala → Patong → Karon → Kata → Rawai. Only about 3 services a day go into the Laguna stop. Lotus Cherng Talay (Hwy 4025) is the more reliable stop, about 1 km from Canvas. Sources disagree on hours: one says 06:30–17:30 from the airport, another says 08:15–23:30. Check the timetable images on phuketsmartbus.com (verify). Useful for cheap daytime trips to Surin, Kamala and Patong. For two people, Grab often costs about the same with far less waiting.", "link": "https://phuketsmartbus.com/timetable"}, {"label": "Blue songthaew (Phuket Town ⇄ Bang Tao/Surin/Kamala)", "detail": "Wooden open-sided bus from Ranong Road (by the Central/Old Market) in Phuket Town to Bang Tao, Surin and Kamala. Fare ฿30–50/person. Runs about 06:00–18:00, roughly every 30 min (irregular). It is not good for evenings, since the last run is around 18:00. The new air-con EV lines (Yellow/Green/Red) do not serve Bang Tao. The free Dragon Line shuttle loops Old Town, Central Festival and the OTOP Market once you are in town.", "link": "https://www.phuket101.net/phuket-blue-bus/"}, {"label": "Laguna shuttle bus & boat", "detail": "Free shuttle bus (06:00–midnight, on-call) and lagoon boat (09:00–midnight, every 20 min) for guests of Laguna Phuket hotels. Canvas Bangtao is outside the Laguna complex, so assume you cannot use them (verify with the front desk). Boat Avenue and Porto de Phuket sit just outside the Laguna gate on Bang Tao's main road. They are a short walk or a ฿100–200 tuk-tuk hop from Canvas, depending on the exact distance (verify on a map; the roadside has patchy pavements).", "link": "https://www.lagunaphuket.com/experience/move-around/"}, {"label": "Private driver for a day (8–10 hrs)", "detail": "A 2026 guide quotes a full-day private driver at about ฿2,000–2,500. Van or SUV, longer hours and Phang Nga trips cost more, commonly ฿3,000–4,000 (verify the quote, including fuel, tolls and parking). Book on Klook or GetYourGuide ('Phuket private car charter'), through your hotel desk, or with a driver you liked from a Grab ride. Worth it for: (a) Old Town + Big Buddha + Wat Chalong + Promthep Cape sunset, (b) Phang Nga Bay/Samet Nangshe viewpoint by road, (c) any day with 4+ stops. Grab's hourly rental product in Phuket is unconfirmed (verify in the app).", "link": "https://www.evephuket.com/blog/phuket-taxi-prices-2026/"}, {"label": "Motorbike taxis (win, orange vests)", "detail": "There are ranks in Patong, Phuket Town and at some Cherngtalay junctions (verify there is one near Canvas). They are cheap for solo short hops, but each bike carries one passenger, so two of you need two bikes, and helmets are often missing or poor. Not recommended, especially after dark or in rain. Phuket has high road-fatality rates, and travel insurance often excludes riding without a helmet.", "link": "https://www.trip.com/guide/transport/phuket-taxi.html"}, {"label": "Boat, island & elephant tour pickups", "detail": "Most Phi Phi, James Bond/Phang Nga, Similan and ethical-elephant-sanctuary tours include round-trip hotel minivan pickup from Bang Tao. Some charge a small north/west-coast supplement (verify when booking). Pickups are early (roughly 06:30–08:00). Give the exact hotel name (Canvas Bangtao, Pasak-Koktanod Rd) and wait in the lobby. If a tour has no transfer, Grab to Bang Rong or Rassada pier (see fares).", "link": "https://www.klook.com/en-US/city/34-phuket-things-to-do/"}, {"label": "Arrival HKT → Canvas Bangtao (Oct 7)", "detail": "Best option: Grab from the airport GrabMeet/designated pickup. Sources disagree on the location (arrivals Level 1 vs departures Level 3), so follow the in-app instructions. Expect ฿250–500, about 25–35 min (~20 km). The official AOT taxi counter is a fixed ฿450–700 zone fare (verify at the counter). The Smart Bus (฿100 pp) only helps in daytime and rarely goes into Laguna. The orange Airport Bus goes to Phuket Town, not Bang Tao. Pre-booked private transfers cost ฿800–1,500 for a car (verify).", "link": "https://phuketexpatguide.com/blog/phuket-airport-transfer-7-options-costs/"}, {"label": "Departure Canvas Bangtao → HKT (Oct 14, ~20:30 flight)", "detail": "Book Grab or Bolt from the hotel about 3 hours before an international flight (about 17:30). The evening Hwy 402/4031 traffic can add 15–20 min. Expect ฿350–600, about 30–45 min. You can also ask the hotel to pre-book a car (often ฿600–900; verify). Don't rely on the Smart Bus for an evening flight: its evening Laguna service and last departure are uncertain.", "link": "https://phuketexpatguide.com/blog/phuket-grab-taxi-guide/"}, {"label": "Safety & price tips", "detail": "Use app rides after dark: the trip is tracked and the price is fixed. Agree tuk-tuk prices before getting in and have small notes ready (฿100/฿500). Check that the car plate matches the app. Don't ride without a helmet, since insurance may not cover you. Avoid unmarked airport touts. On Bangla Road nights, walk 5–10 min off Bangla (e.g. toward Jungceylon or Rat-U-Thit Rd) for an easier Grab pickup. Rides back to Bang Tao from Patong after midnight may surge (verify).", "link": "https://phuketexpatguide.com/blog/phuket-grab-taxi-guide/"}], "fares": [{"to": "HKT Airport", "grab": "฿250–500 · 25–35 min (evening 30–45)", "bolt": "~10–25% below Grab (verify)", "tuktuk": "฿700–1,500 (negotiate)", "other": "AOT counter taxi (from airport) ~฿450–700 verify; Smart Bus ฿100 pp daytime only, few Laguna runs"}, {"to": "Phuket Old Town", "grab": "฿220–550 · 35–45 min (sources vary widely; verify in app)", "bolt": "~20% below Grab (verify)", "tuktuk": "~฿700–1,000 (verify)", "other": "Blue songthaew ฿30–50 pp from Bang Tao road, ~06:00–18:00, ~60+ min"}, {"to": "Patong (Bangla / Bangla Boxing Stadium)", "grab": "฿220–600 · 30–40 min (surge late night)", "bolt": "~฿450 (May 2026 test)", "tuktuk": "~฿500–800 (verify)", "other": "Smart Bus ฿100 pp via Surin/Kamala, daytime"}, {"to": "Kamala (Café del Mar)", "grab": "~฿200–350 · 15–20 min (est. verify)", "bolt": "slightly less than Grab (verify)", "tuktuk": "~฿400–600 (verify)", "other": "Smart Bus ฿100 pp; blue songthaew ฿30–50 (daytime)"}, {"to": "Surin Beach", "grab": "~฿120–200 · 10 min (est. verify)", "bolt": "slightly less (verify)", "tuktuk": "฿200–350", "other": "Smart Bus ฿100 pp; blue songthaew ฿30–50"}, {"to": "Layan Beach", "grab": "~฿100–180 · 8–10 min (est. verify)", "bolt": "slightly less (verify)", "tuktuk": "~฿200–300 (verify)", "other": "—"}, {"to": "Chalong (Big Buddha / Wat Chalong)", "grab": "~฿450–750 · 45–60 min (est. verify)", "bolt": "~20% below Grab (verify)", "tuktuk": "~฿1,000+ (verify)", "other": "Best combined with Old Town on a priv const addDays = (iso,n) => new Date(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10)+n)).toISOString().slice(0,10);
const fmtDay = iso => { const d=new Date(iso+"T00:00:00Z"); return {dow:d.toLocaleDateString("en-US",{weekday:"short",timeZone:"UTC"}),n:d.getUTCDate(),mon:d.toLocaleDateString("en-US",{month:"short",timeZone:"UTC"})} };
function km(a,b){const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b[1]-a[1])*r)*Math.cos(b[0]*r),x=Math.cos(a[0]*r)*Math.sin(b[0]*r)-Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r);return (Math.atan2(y,x)/r+360)%360}
const compass = deg => ["N","NE","E","SE","S","SW","W","NW"][Math.round(deg/45)%8];
function fmtDist(k){ if(k<1) return Math.round(k*1000/10)*10+" m"; return (k<10?k.toFixed(1):Math.round(k))+" km"; }
function walkMin(k){ return Math.round(k*1.3*1000/80); } // 1.3 street-detour factor, 80 m/min
function travelHint(k){ const w=walkMin(k); if(w<=30) return w+" min walk"; if(k<=15) return "Grab ~"+Math.max(5,Math.round(k*3.2))+" min"; return "Grab ~"+Math.round(k*1.6+5)+" min"; }

function shortRating(r){ r=String(r||""); const parts=[];
  const star=/(\d)\s*Michelin star|(\d) Michelin stars|Michelin[^,;.]*?(\d)\s*star/i.exec(r); if(star) parts.push((star[1]||star[2]||star[3])+"★ Michelin");
  else if(/Bib Gourmand/i.test(r)&&!/past|formerly|previously|dropped/i.test(r.split(/Bib Gourmand/i)[0].slice(-30))) parts.push("Bib Gourmand");
  else if(/Michelin (Guide )?(20\d\d )?(selected|featured|listed|Guide 20)/i.test(r)) parts.push("Michelin Guide");
  const b=/50 Best[^;,.]*?No\.?\s*(\d+)/i.exec(r); if(b) parts.push("50 Best #"+b[1]);
  const g=/Google\s*(\d\.\d)/i.exec(r); if(g&&!P.length) parts.push("★ "+g[1]);
  return parts.slice(0,2); }
const FX = 33;
function thb(p){ if(p.priceTHB!=null) return +p.priceTHB; const m=String(p.approxCostPerPerson||p.cost||"").replace(/,/g,"").match(/฿\s*(\d+)(?:\s*[-–]\s*(\d+))?/); if(m) return m[2]?Math.round((+m[1]+ +m[2])/2):+m[1]; if(/free/i.test(p.cost||"")) return 0; return null; }

function nearChips(p){
  if(!p.lat) return "";
  const n=P.filter(q=>q.id!==p.id&&q.city===p.city&&q.lat&&!q.approx&&km([p.lat,p.lng],[q.lat,q.lng])<=0.8).map(q=>({q,d:km([p.lat,p.lng],[q.lat,q.lng])})).sort((a,b)=>a.d-b.d).slice(0,5);
  if(!n.length||p.approx) return "";
  return `<div class="nearby"><span class="eyebrow">Within a 10-min walk</span><div class="row">${n.map(({q,d})=>`<button class="mini" data-jump="${esc(q.id)}" style="${catVar(q)}"><span class="dot" style="background:var(--cat)"></span>${esc(q.name||q.title)} <small>${walkMin(d)}′</small></button>`).join("")}</div></div>`;
}
function dirUrl(p){
  const q=p.mapsQuery||(p.name||p.title)+" "+HOME[p.city].short;
  const d=distFromHome(p); const mode = d!=null && walkMin(d)<=25 ? "walking" : "";
  const origin = S.me ? S.me.lat+","+S.me.lng : "";
  return "https://www.google.com/maps/dir/?api=1"+(origin?"&origin="+origin:"")+"&destination="+encodeURIComponent(q)+(mode?"&travelmode="+mode:"");
}

/* ================= hero / transit line ================= */
function transitLine(){
  const n=16, W=340, x0=10, step=(W-20)/(n-1), y=22;
  const idx=dayDiff(LINE_START,todayISO);
  const X=i=>x0+i*step;
  const seg=(a,b,col,dash)=>`<line x1="${X(a)}" y1="${y}" x2="${X(b)}" y2="${y}" stroke="${col}" stroke-width="${dash?2:4}" stroke-linecap="round" ${dash?'stroke-dasharray="1 5"':""}/>`;
  let s=seg(0,2,"var(--night-muted)",1)+seg(2,7,"var(--marigold-fill)")+seg(7,14,"var(--lagoon-glow)")+seg(14,15,"var(--night-muted)",1);
  for(let i=0;i<n;i++){
    const iso=addDays(LINE_START,i), past=iso<todayISO, key=[0,2,7,14,15].includes(i);
    const col=i<2||i>14?"var(--night-muted)":i<7?"var(--marigold-fill)":"var(--lagoon-glow)";
    s+=`<circle cx="${X(i)}" cy="${y}" r="${key?5:3}" fill="${key?"var(--night)":col}" stroke="${col}" stroke-width="${key?2.5:0}" opacity="${past?.45:1}"/>`;
  }
  if(idx>=0&&idx<n){ s+=`<circle class="pulse" cx="${X(idx)}" cy="${y}" r="7" fill="none" stroke="var(--night-ink)" stroke-width="1.5"/><circle cx="${X(idx)}" cy="${y}" r="5.5" fill="var(--night-ink)"/>`; }
  const lab=(i,t,sub,anchor,up)=>up?`<text x="${X(i)}" y="${y-12}" text-anchor="${anchor}" class="k">${t} <tspan style="fill:var(--night-muted)">${sub}</tspan></text>`:`<text x="${X(i)}" y="${y+22}" text-anchor="${anchor||"middle"}" class="k">${t}</text><text x="${X(i)}" y="${y+34}" text-anchor="${anchor||"middle"}">${sub}</text>`;
  s+=lab(0,"PHX","SEP 30","start",1)+lab(2,"BKK","OCT 2")+lab(7,"HKT","OCT 7")+lab(14,"FLY","OCT 14")+lab(15,"PHX","OCT 15","end",1);
  return `<svg class="line-svg" viewBox="0 -4 ${W} 66" role="img" aria-label="Trip timeline from Sep 30 to Oct 15">${s}</svg>`;
}
function heroHTML(){
  const c=S.city, h=HOME[c];
  const i=dayDiff("2026-10-02",todayISO);
  let big,small;
  if(todayISO<"2026-09-30"){const d=dayDiff(todayISO,"2026-09-30");big=d;small=d===1?"day to wheels-up":"days to wheels-up";}
  else if(todayISO<"2026-10-02"){big="✈";small="in the air";}
  else if(todayISO<="2026-10-14"){big="Day "+(i+1);small="of 13";}
  else if(todayISO==="2026-10-15"){big="✈";small="heading home";}

  const stayLeft = c==="bkk" ? dayDiff(todayISO>"2026-10-02"?todayISO:"2026-10-02","2026-10-07") : dayDiff(todayISO>"2026-10-07"?todayISO:"2026-10-07","2026-10-14");
  return `<div class="hero">

      <div><span class="eyebrow">${c==="bkk"?"Oct 2 – 7 · 5 nights":"Oct 7 – 14 · 7 nights"}</span><div class="thai-name" lang="th">${h.thaiName}</div><div class="en-name">${h.enName}</div></div>

function listView(kind){
  const c=S.city;
  const F = kind==="eat" ? "eatF":"doF";
  let list=P.filter(p=>p.city===c&&p.kind===kind);
  const q=S.q.toLowerCase();
  const catsHere = kind==="eat" ? ["coffee","street","local","midrange","splurge","bar","grocery"].filter(k=>list.some(p=>p.cat===k)) : ["walk",...new Set(list.filter(p=>p.cat==="do").map(p=>p.type).filter(Boolean))].filter(k=>k!=="walk"||list.some(p=>p.cat==="walk"));
  const chips=[["all","All",""],["saved","Saved","--orchid"],...catsHere.map(k=>[k,CATS[k]?.label||k[0].toUpperCase()+k.slice(1),CATS[k]?.v||"--c-do"])];
  const base=list.slice();
  const fx=S.fx;
  list=list.filter(p=>{
    const f=S[F];
    const okF = f==="all" || (f==="saved"?S.saved[p.id]: kind==="eat"?p.cat===f : (f==="walk"?p.cat==="walk":p.type===f));
    if(!okF) return false;
    if(q && !JSON.stringify(p).toLowerCase().includes(q)) return false;
    if(fx.price.length){ if(kind==="eat"){ if(!fx.price.includes(tier(p))) return false; } else { const t=thb(p); const b=t==null?-1:t===0?0:t<500?1:t<2000?2:3; if(!fx.price.includes(b)) return false; } }
    if(fx.dist!=="any"){ const d=distFromHome(p); if(d==null) return false; if(fx.dist==="walk"&&walkMin(d)>15) return false; if(fx.dist==="2"&&d>2) return false; if(fx.dist==="5"&&d>5) return false; }
    if(fx.tag && !tagsOf(p).includes(fx.tag)) return false;
    if(fx.fave && !p.localFavorite) return false;
    return true;
  });
  const sorters={
    near:(a,b)=>(distFromHome(a)??999)-(distFromHome(b)??999),
    rating:(a,b)=>(b.googleRating||0)-(a.googleRating||0)||(b.googleReviews||0)-(a.googleReviews||0),
    popular:(a,b)=>(b.googleReviews||0)-(a.googleReviews||0),
    cheap:(a,b)=>(thb(a)??1e9)-(thb(b)??1e9),
    pricey:(a,b)=>(thb(b)??-1)-(thb(a)??-1)
  };
  if(sorters[S.sort]) list=list.slice().sort(sorters[S.sort]);
  const tags=[...new Set(base.flatMap(tagsOf))].sort((a,b)=>base.filter(p=>tagsOf(p).includes(b)).length-base.filter(p=>tagsOf(p).includes(a)).length);
  const nF = fx.price.length+(fx.dist!=="any")+(!!fx.tag)+(fx.fave?1:0);
  const priceChips = kind==="eat" ? [[1,"฿ under ฿200"],[2,"฿฿ ฿200–600"],[3,"฿฿฿ ฿600–2k"],[4,"฿฿฿฿ ฿2k+"]] : [[0,"Free"],[1,"Under ฿500"],[2,"฿500–2k"],[3,"฿2k+"]];
  const heads = {eat:{bkk:"Where Bangkok eats, sips and drinks",hkt:"Southern Thai, seafood and sunset drinks"},do:{bkk:"The Bangkok most visitors miss",hkt:"Phuket beyond Patong"}};
  return `<section class="view">
    <div class="view-head"><span class="eyebrow">${kind==="eat"?"Eat & Drink":"Do & Walk"} · ${HOME[c].short}</span><h1>${heads[kind][c]}</h1></div>
    ${kind==="do"&&c==="hkt"&&D.cityInfo?.hkt?.seaConditions?`<details class="sea"><summary style="cursor:pointer;list-style:none"><span class="eyebrow" style="color:var(--lagoon)">October sea conditions · read this ›</span></summary><p style="margin-top:6px">${esc(D.cityInfo.hkt.seaConditions)}</p></details>`:""}
    <input class="search" id="q-${kind}" type="search" placeholder="${kind==="eat"?"Search dishes, coffee, rooftops, areas…":"Search walks, markets, beaches…"}" value="${esc(S.q)}">
    <div class="filters">${chips.map(([k,l,v])=>`<button class="chip" data-f="${F}" data-v="${esc(k)}" aria-pressed="${S[F]===k}" ${v?`style="--cat:var(${v})"`:""}>${v?'<span class="dot"></span>':""}${esc(l)}</button>`).join("")}</div>
    <div class="toolbar">
      <button class="chip ${nF?"on":""}" data-showf="1" aria-expanded="${S.showF}">${G.filter}Filters${nF?` · ${nF}`:""}</button>
      <label class="sortsel"><span class="eyebrow">Sort</span><select id="sort-${kind}" data-sortsel="1">${[["curated","Guide's picks"],["near","Nearest to home"],["rating","Top rated"],["popular","Most reviewed"],["cheap","Price: low to high"],["pricey","Price: high to low"]].map(([v,l])=>`<option value="${v}" ${S.sort===v?"selected":""}>${l}</option>`).join("")}</select></label>
    </div>
    ${S.showF?`<div class="fpanel">
      <div><span class="eyebrow">${kind==="eat"?"Price per person":"Cost per person"}</span><div class="row">${priceChips.map(([v,l])=>`<button class="chip sm" data-fprice="${v}" aria-pressed="${fx.price.includes(v)}">${l}</button>`).join("")}</div></div>
      <div><span class="eyebrow">Distance from home</span><div class="row">${[["any","Any"],["walk","≤ 15 min walk"],["2","≤ 2 km"],["5","≤ 5 km"]].map(([v,l])=>`<button class="chip sm" data-fdist="${v}" aria-pressed="${fx.dist===v}">${l}</button>`).join("")}</div></div>
      ${tags.length?`<label><span class="eyebrow">${kind==="eat"?"Food & drink type":"Kind of activity"}</span><select id="tag-${kind}" data-ftag="1" class="search" style="padding:9px 10px"><option value="">All types</option>${tags.map(t=>`<option ${fx.tag===t?"selected":""}>${esc(t)}</option>`).join("")}</select></label>`:""}
      <div class="row" style="justify-content:space-between"><label class="check" style="padding:0"><input type="checkbox" id="fave-${kind}" data-ffave="1" ${fx.fave?"checked":""}><span>Local favorites only</span></label>${nF?`<button class="btn" data-freset="1">Clear filters</button>`:""}</div>
    </div>`:""}
    <span class="count">${list.length} of ${base.length} ${kind==="eat"?"places":"ideas"}${S.sort==="near"?" · nearest first":""}</span>
    <div class="grid2">${list.map(p=>card(p)).join("")||`<div class="empty">No matches. Try another filter.</div>`}</div>
  </section>`;
}
